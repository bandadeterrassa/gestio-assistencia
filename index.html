    case 'reload': return location.reload();
    case 'eye': { const L = loginState; L.user = $('#lg-user').value; L.pass = $('#lg-pass').value; L.keep = $('#lg-keep').checked; L.show = !L.show; render(); $('#lg-pass').focus(); return; }
    case 'keep': { const L = loginState; L.user = $('#lg-user').value; L.pass = $('#lg-pass').value; L.keep = !L.keep; render(); return; }
    case 'logout': {
      if (t1) { clearTimeout(t1); await flush(); }   // no es perd cap canvi fet just abans de sortir
      if (TOKEN) { try { sb.rpc('app_logout', { p_token: TOKEN }); } catch {} }
      ME = null; REAL_ADMIN = null; TOKEN = null; saveSession();
      const keepName = S.config.name, keepLogo = S.config.logo;   // de la banda, no de cap persona
      S = structuredClone(DEFAULT); S.config.name = keepName; S.config.logo = keepLogo; BASE = null; LOAD_OK = false; OFFLINE = false;
      closeSheet(); clearTimeout(toastT); toastState = null; renderToast();
      ui.tab = null; render(); return;
    }
    case 'hint-ok': HINTS[el.dataset.id] = true; saveHints(); render(); return;
    case 'undo': { const t = toastState; if (t && t.undo) { toastState = null; renderToast(); t.undo(); } return; }
    case 'retry-net': case 'retry-do': { toastState = null; renderToast(); await flush(true); if (!OFFLINE) toast('Tornes a estar en línia. Canvis desats.'); else toast('Encara no hi ha connexió.', { err: true }); return; }
    case 'demo': return demo();
    case 'show-help': return helpSheet();
    case 'addapp': return addAppSheet();
    case 'a2hs': if (installPrompt) { installPrompt.prompt(); installPrompt = null; closeSheet(); } return;
    case 'addcal': case 'cal-subscribe': return subscribeSheet();
    case 'copy-feed': { try { await navigator.clipboard.writeText(CALENDAR_FEED_URL); toast('Enllaç copiat'); } catch { const i = $('#sheet-root input[readonly]'); if (i) { i.select(); } toast('Selecciona l’enllaç i copia’l'); } return; }

    /* assistència (llista) */
    case 'llista-mode': ui.llistaMode = el.dataset.id; ui.rollSec = null; save(); render(); return;
    case 'sess-prev': case 'sess-next': {
      const list = allSessions(); const i = list.findIndex(s => s.id === (cur && cur.id));
      const j = a === 'sess-prev' ? i - 1 : i + 1;
      if (list[j]) { ui.sessionId = list[j].id; ui.rollSec = null; render(); } return;
    }
    case 'sess-pick': return sessionPicker();
    case 'pick-sess': ui.sessionId = el.dataset.sid; ui.rollSec = null; closeSheet(); render(); return;
    case 'goto-sess': closeSheet(); ui.sessionId = el.dataset.sid; ui.rollSec = null; ui.tab = 'llista'; ui.llistaMode = 'roll'; save(); render(); return;
    case 'sess-info': return sessionInfo(el.dataset.sid);
    case 'open-sec': ui.rollSec = el.dataset.sec; render(); return;
    case 'close-sec': ui.rollSec = null; render(); return;
    case 'mark': {
      if (!cur || !can.passList()) return;
      const mid = el.dataset.mid, s = el.dataset.s;
      const target = userById(mid);
      if (!can.section(target.section)) { toast('Només pots passar llista de la teva secció'); return; }
      const prev = mark(cur.id, mid);
      if (prev && prev.s === s) setMark(cur.id, mid, null);
      else {
        const pend = S.incidents.find(i => i.userId === mid && i.sessionId === cur.id && i.status === 'pending' && i.kind === 'absence');
        const note = s === 'FJ' ? (prev?.note || (pend ? pend.reason : '')) : (s !== 'P' && prev?.note ? prev.note : '');
        setMark(cur.id, mid, { s, ...(s === 'R' ? { min: prev?.min || 10 } : {}), ...(note ? { note } : {}) });
      }
      render();
      if (s === 'FJ') { const inp = $(`.rsn[data-mid="${mid}"]`); if (inp && !inp.value) inp.focus(); }
      return;
    }
    case 'min': { if (!cur) return; const mk = mark(cur.id, el.dataset.mid); if (!mk) return;
      setMark(cur.id, el.dataset.mid, { ...mk, min: Number(el.dataset.min) }); render(); return; }
    case 'rest-present': {
      if (!cur || !can.section(el.dataset.sec)) return;
      for (const m of membersOf(el.dataset.sec)) if (inSession(cur, m) && !mark(cur.id, m.id)) setMark(cur.id, m.id, { s: 'P' });
      render(); toast('Tots els músics sense marca queden com a presents.'); return;
    }

    /* avisos */
    case 'avis': return incidentSheet(el.dataset.kind);
    case 'new-incident': return incidentSheet();
    case 'avis-from-sess': closeSheet(); return incidentSheet('absence', el.dataset.sid);
    case 'pbox': ui.statsProj = el.dataset.proj || 'all'; ui.tab = 'estadistiques'; save(); render(); return;
    case 'att': ui.statsAtt = !(ui.statsAtt === undefined ? true : ui.statsAtt); render(); return;
    case 'inc-past': ui.incPast = !ui.incPast; save(); render(); return;
    case 'inc-filter': ui.incFilter = el.dataset.v; save(); render(); return;
    case 'inc-accept': return reviewIncident(el.dataset.id, true);
    case 'inc-reject': return reviewIncident(el.dataset.id, false);
    case 'inc-open': return incidentDetail(el.dataset.id);
    case 'inc-reopen': return reopenIncident(el.dataset.id);
    case 'inc-edit': return editIncidentSheet(el.dataset.id);
    case 'inc-del': return deleteIncidentSheet(el.dataset.id);
    case 'inc-del-own': {   // el propietari, només mentre l'avís no s'ha revisat
      const inc = S.incidents.find(i => i.id === el.dataset.id);
      if (!inc || inc.userId !== ME || inc.status !== 'pending') return;
      S.incidents = S.incidents.filter(i => i.id !== inc.id); save(); closeSheet(); render();
      toast('Avís eliminat.', { undo: () => { S.incidents.push(inc); save(); render(); } }); return;
    }

    /* calendari + estadístiques */
    case 'cal-proj': ui.calProj = el.dataset.id; save(); render(); return;
    case 'cal-past': ui.calPast = !ui.calPast; render(); { const sc = $('#view .scroll'), nx = document.querySelector('.scard .spill.n'); if (sc) sc.scrollTop = ui.calPast && nx ? Math.max(0, nx.closest('.scard').offsetTop - 110) : 0; } return;
    case 'cal-mode': ui.calMode = el.dataset.id; save(); render(); return;
    case 'show-done': ui.calShowDone = !ui.calShowDone; render(); return;
    case 'stats-proj': ui.statsProj = el.dataset.id; save(); render(); return;
    case 'pick-proj': return projectPickerSheet(el.dataset.scope);
    case 'proj-pick-go': {
      if (el.dataset.scope === 'cal') { ui.calProj = el.dataset.id; } else ui.statsProj = el.dataset.id;
      save(); closeSheet(); render(); return;
    }
    case 'stats-sec': ui.statsSec = el.dataset.sec; render(); return;
    case 'stats-flt': ui.statsFlt = el.dataset.k; render(); return;
    case 'falt': ui.statsFalt = !ui.statsFalt; render(); return;
    case 'member-detail': return memberDetail(el.dataset.mid);

    /* gestió */
    case 'manage': ui.manage = el.dataset.id; ui.search = ''; save(); render(); return;
    case 'fee-filter': ui.feeFilter = el.dataset.v; render(); return;
    case 'fee-reset': return feeResetSheet();
    case 'fee': {
      const x = userById(el.dataset.uid); if (!x || !canFee() || typeof x.feePaid !== 'boolean') return;
      x.feePaid = !x.feePaid; save(); render();
      toast(`Quota de ${x.name}: ${x.feePaid ? 'pagada' : 'pendent'}.`, { undo: () => { const y = userById(x.id); if (y) { y.feePaid = !y.feePaid; save(); render(); } } }); return;
    }
    case 'new-user': return userSheet({ section: el.dataset.sec || '', roles: ['musician'], active: true, feePaid: false });
    case 'edit-user': { const x = userById(el.dataset.uid); if (x && can.seeMember(x)) userSheet({ ...x }); return; }
    case 'del-user': {
      if (!confirm('Eliminar aquest usuari i totes les seves dades d\'assistència?')) return;
      const id = el.dataset.uid;
      S.users = S.users.filter(u => u.id !== id);
      S.incidents = S.incidents.filter(i => i.userId !== id);
      for (const k of Object.keys(S.attendance)) if (k.endsWith('|' + id)) delete S.attendance[k];
      save(); closeSheet(); render(); toast('Usuari eliminat'); return;
    }
    case 'new-proj': return projSheet({});
    case 'edit-proj': { const p = S.projects.find(x => x.id === el.dataset.pid); if (p) projSheet({ ...p }); return; }
    case 'view-proj': return projectInfo(el.dataset.pid);
    case 'del-proj': {
      if (!confirm('Eliminar el projecte? Les sessions que només pertanyien a aquest projecte també s\'eliminaran.')) return;
      const pid = el.dataset.pid;
      const orphans = [];
      for (const s of S.sessions) { s.projIds = (s.projIds || []).filter(x => x !== pid); if (!s.projIds.length) orphans.push(s.id); }
      for (const sid of orphans) {
        for (const k of Object.keys(S.attendance)) if (k.startsWith(sid + '|')) delete S.attendance[k];
        S.incidents = S.incidents.filter(i => i.sessionId !== sid);
      }
      S.sessions = S.sessions.filter(s => !orphans.includes(s.id));
      S.projects = S.projects.filter(x => x.id !== pid);
      if (ui.calProj === pid) ui.calProj = 'all';
      save(); closeSheet(); render(); return;
    }
    case 'new-session': { if (!S.projects.length) { toast('Crea primer un projecte'); return projSheet({}); } return sessionSheet({}, el.dataset.pid); }
    case 'sess-edit': { const s = sessionById(el.dataset.sid); if (s && can.manageProjects()) sessionSheet({ ...s }); return; }
    case 'edit-sess-project': { if (hasRole(me(), 'director')) sessionProjectSheet(el.dataset.sid); return; }
    case 'del-session': {
      if (!confirm('Eliminar la sessió i la seva llista?')) return;
      const sid = el.dataset.sid;
      S.sessions = S.sessions.filter(x => x.id !== sid);
      for (const k of Object.keys(S.attendance)) if (k.startsWith(sid + '|')) delete S.attendance[k];
      S.incidents = S.incidents.filter(i => i.sessionId !== sid);
      if (ui.sessionId === sid) ui.sessionId = null;
      save(); closeSheet(); render(); return;
    }
    case 'list-sessions': return listSessionsSheet(el.dataset.pid);
    case 'repeat-sessions': return repeatSheet(el.dataset.pid);
    case 'edit-identity': return identitySheet();
    case 'edit-rules': return rulesSheet();
    case 'edit-places': return placesSheet();
    case 'edit-types': return typesSheet();
    case 'edit-instruments': return sectionsSheet();
    case 'new-section': return sectionEditSheet(null);
    case 'edit-section': return sectionEditSheet(el.dataset.id);
    case 'sec-move': {
      const i = Number(el.dataset.i), dir = Number(el.dataset.dir), j = i + dir;
      if (j < 0 || j >= SECTIONS.length) return;
      [SECTIONS[i], SECTIONS[j]] = [SECTIONS[j], SECTIONS[i]];
      saveSections(); sectionsSheet(); return;
    }
    case 'del-section': {
      const id = el.dataset.id;
      const n = membersOf(id).length;
      if (n) { toast(`No es pot eliminar: ${n} músic${n === 1 ? '' : 's'} hi són assignats`); return; }
      if (!confirm(`Eliminar la secció "${SEC[id].name}"?`)) return;
      SECTIONS = SECTIONS.filter(x => x.id !== id);
      SEC = Object.fromEntries(SECTIONS.map(x => [x.id, x]));
      saveSections(); closeSheet(); sectionsSheet(); return;
    }
    case 'export': return doExport(false);
    case 'export-csv': return doExportCsv();
    case 'import': return importSheet();
    case 'impersonate': return impersonateSheet();
    case 'impersonate-go': {
      const targetId = el.dataset.uid;
      if (REAL_ADMIN && targetId === REAL_ADMIN) { ME = REAL_ADMIN; REAL_ADMIN = null; }
      else { if (!REAL_ADMIN) REAL_ADMIN = ME; ME = targetId; }
      saveSession(); closeSheet(); ui.tab = null; ui.rollSec = null; render(); return;
    }
    case 'end-impersonate': {
      if (!REAL_ADMIN) return;
      ME = REAL_ADMIN; REAL_ADMIN = null; saveSession(); ui.tab = null; ui.rollSec = null; render(); return;
    }
    case 'wipe': {
      if (!confirm('Esborrar tots els usuaris, projectes, llistes i avisos?')) return;
      const keepId = REAL_ADMIN || ME; const keep = S.users.find(u => u.id === keepId);
      S = structuredClone(DEFAULT); S.config.types = TYPES; S.users = keep ? [keep] : []; ui.tab = null; save(); render(); toast('Dades esborrades'); return;
    }

    /* fulls */
    case 'change-password': return changePasswordSheet(false);
    case 'unlock-pass': {
      const wrap = document.getElementById('u-pass-wrap'); if (!wrap) return;
      wrap.innerHTML = passField('u-pass', 'Estableix-ne una de nova', '');
      return;
    }
    case 'toggle-pass': {
      const inp = document.getElementById(el.dataset.target); if (!inp) return;
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      el.setAttribute('aria-pressed', String(show));
      return;
    }
    case 'sheet-close': return closeSheet();
    case 'sheet-save': { const ok = sheetSave && await sheetSave(); if (ok !== false) { closeSheet(); render(); } return; }
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.act === 'toggle-late') { S.config.countLateAsPresent = e.target.checked; save(); render(); }
  if (e.target.dataset && e.target.dataset.act === 'min-custom') {
    const cur = currentSession(); if (!cur) return;
    const mid = e.target.dataset.mid; const mk = mark(cur.id, mid); if (!mk) return;
    const n = Number(e.target.value);
    if (!n || n < 1) return;
    setMark(cur.id, mid, { ...mk, min: Math.min(180, n) });
    render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'usearch') { ui.search = el.value; const v = el.value; render(); const s = $('#usearch'); if (s) { s.value = v; s.focus(); s.setSelectionRange(v.length, v.length); } return; }
  if (el.dataset && el.dataset.act === 'note') {
    const cur = currentSession(); if (!cur) return;
    const mk = mark(cur.id, el.dataset.mid); if (!mk) return;
    S.attendance[aKey(cur.id, el.dataset.mid)] = { ...mk, note: el.value, by: ME, at: stamp() };
    save();
  }
});
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));   // sense pinça-zoom a iOS
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet-root .sheet')) closeSheet(); if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.tap[role=button]')) { e.preventDefault(); e.target.click(); } });
window.addEventListener('online', () => { if (ME && OFFLINE) flush(true); });
window.addEventListener('offline', () => { if (ME) setOffline(true); });

/* ================= Init ================= */
let nextSig = null;
setInterval(() => {
  if (!ME) return;
  const n = allSessions().find(x => !sessionIsDone(x)); const sig = TODAY + '|' + (n ? n.id : '');
  if (nextSig !== null && sig !== nextSig && !$('#sheet-root .sheet')) render();
  nextSig = sig;
}, 30000);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && ME && !$('#sheet-root .sheet')) render();
  if (document.visibilityState === 'hidden') { if (t1) { clearTimeout(t1); flush(); } return; }
  // En tornar a l'app: si fa estona que no s'ha actualitzat i no hi ha res pendent ni cap full obert, es baixen les dades noves.
  if (!ME || !LOAD_OK || saving || t1 || Date.now() - LAST_LOAD < 60000 || $('#sheet-root .sheet')) return;
  if (buildChanges().ch) return;
  if (await fetchAll()) {
    if (ME && !S.users.some(u => u.id === ME && u.active !== false)) { ME = null; TOKEN = null; saveSession(); }
    render();
  } else if (LAST_EXPIRED) sessionExpired();
});
(async () => {
  await load();
  if (ME) splash(() => { render(); const u = me(); if (u && u.mustChangePassword) changePasswordSheet(true); }); else render();
})();
})();
</script>
</body>
</html>
