<style>
:root{
  /* ── Brand ── */
  --brand-navy:#102A43; --brand-pink:#F05FA3; --brand-orange:#FCB03C; --brand-black:#0A0A0A; --brand-white:#F8FAFC;
  /* ── Accent (admin-selectable hue; navy is the brand default) ── */
  --accent-h:212; --accent-s:32%; --accent-l:15%;
  --accent:hsl(var(--accent-h) var(--accent-s) var(--accent-l));
  --accent-ink:#FFFFFF;
  --accent-soft:hsl(var(--accent-h) 50% 95%);
  --accent-line:hsl(var(--accent-h) 38% 82%);
  --accent-2:var(--brand-pink);
  --gold:#D6A84F; --gold-ink:#4A340B;
  --notice:var(--gold); --notice-ink:var(--gold-ink);
  /* ── Neutrals — cool, matte, navy-tinted ── */
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#EEF2F6; --line:#E1E7EF; --line-strong:#C7D1DD;
  --ink:#10151F; --ink-2:#3A4453; --muted:#67728A;
  /* ── Semantic status (unchanged meaning: verd/blau/taronja/vermell) ── */
  --p:#1F9A57; --p-ink:#FFFFFF; --p-soft:#DDF2E5;
  --r:#3E9DC9; --r-ink:#FFFFFF; --r-soft:#DCEFFA;
  --fj:var(--gold); --fj-ink:var(--gold-ink); --fj-soft:#F6E8CC;
  --fnj:#D8433E; --fnj-ink:#FFFFFF; --fnj-soft:#FAE0DF;
  --np:#948D9A; --np-ink:#FFFFFF; --np-soft:#ECE9EF;
  --warn-bg:#F6E8CC; --warn-fg:#5C3E0A; --ok-bg:#D8F0E2; --ok-fg:#0D6B3C; --bad-bg:#F9DCDB; --bad-fg:#A3231F; --info-bg:#D7ECF7; --info-fg:#0B4C6B;
  --overlay:rgba(10,15,23,.46);
  /* ── Elevation ── */
  --shadow-sm:0 1px 2px rgba(16,21,31,.06);
  --shadow:0 1px 2px rgba(16,21,31,.04), 0 18px 38px -10px rgba(16,21,31,.16);
  --shadow-lg:0 2px 6px rgba(16,21,31,.06), 0 28px 56px -14px rgba(16,21,31,.24);
  /* ── Motion — spring-like deceleration curves ── */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  /* ── Type ── */
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hanken Grotesk",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-display:var(--f-ui); --f-mono:var(--f-ui);
  --fs-1:11px; --fs-2:12.5px; --fs-3:13.5px; --fs-4:15px; --fs-5:16px; --fs-6:18px; --fs-7:21px; --fs-8:25px; --fs-9:32px;
  /* ── Shape / rhythm (8px grid) ── */
  --r-sm:10px; --r-md:16px; --r-lg:24px; --nav-h:64px;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;width:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs-4);line-height:1.45;-webkit-tap-highlight-color:transparent;padding-inline:16px;padding-block:env(safe-area-inset-top, 0px) calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
body.no-nav{padding-block:0 24px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
img,svg{max-width:100%}

/* Splash + login */
.splash{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;gap:0;animation:fade .2s ease}
.splash-in{display:grid;justify-items:center;gap:16px}
.logo{width:88px;height:88px;border-radius:26px;background:linear-gradient(155deg, var(--brand-navy), hsl(var(--accent-h) var(--accent-s) 14%) 65%);box-shadow:var(--shadow-lg), 0 0 0 1px color-mix(in srgb, var(--line-strong) 70%, transparent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:30px;letter-spacing:.02em;object-fit:cover}
.splash .t{font-size:var(--fs-6);font-weight:700}
.splash .s{font-size:var(--fs-3);color:var(--muted);display:flex;align-items:center;gap:8px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-2);margin-left:3px;animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.login{min-height:100svh;display:grid;align-content:center;justify-items:center;gap:18px;padding:32px 0;text-align:center}
.login form{display:grid;gap:12px;width:min(100%,340px);text-align:left}
.login .h1{font-size:var(--fs-8)}
.login-foot{font-size:var(--fs-2);color:var(--muted);max-width:34ch}
.err{background:var(--fnj-soft);color:var(--fnj);border-radius:10px;padding:8px 12px;font-size:var(--fs-3);font-weight:600}

/* App bar + nav */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.impersonate-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn-fg);padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:12px}
.impersonate-banner b{font-weight:700}
.impersonate-banner .btn{flex:none;background:var(--warn-fg);color:var(--warn-bg);border-color:var(--warn-fg)}
.brand{min-width:0;display:flex;align-items:center;gap:11px}
.brand-mark{width:42px;height:42px;flex:none;border-radius:13px;background:linear-gradient(155deg, var(--brand-navy), hsl(var(--accent-h) var(--accent-s) 14%) 70%);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.02em;object-fit:cover;box-shadow:var(--shadow-sm), 0 0 0 1px color-mix(in srgb, var(--line-strong) 70%, transparent)}
.brand-name{display:block;font-weight:700;font-size:clamp(17px,4.6vw,21px);line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
.brand-sub{display:block;font-size:var(--fs-2);color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2);flex:none}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);transition:transform .15s var(--ease-spring),background .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.plain{border-color:transparent;background:transparent}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:760px;margin-inline:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:var(--fs-1);font-weight:600;color:var(--muted);padding-inline:1px;min-width:0}
.tab span:last-child{max-width:100%;line-height:1.15;text-align:center;white-space:nowrap}
@media (max-width:360px){.tab span:last-child{font-size:8px;letter-spacing:-.03em}}
@media (max-width:340px){.tab span:last-child{font-size:7.5px}}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .tab-ico{background:var(--accent-soft);transform:translateY(-1px)}
.tab-ico{position:relative;display:grid;place-items:center;width:52px;height:28px;border-radius:999px;transition:background .2s var(--ease-out),transform .3s var(--ease-spring)}
.tab-badge{position:absolute;top:-3px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--notice);color:var(--notice-ink);font-size:10.5px;font-weight:700;line-height:17px;text-align:center}

/* Common */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 14px;flex-wrap:wrap}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-weight:700;font-size:var(--fs-8);line-height:1.12;letter-spacing:-.02em}
.h2{font-weight:700;font-size:var(--fs-6);line-height:1.2;letter-spacing:-.01em}
.eyebrow{font-size:var(--fs-1);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;font-weight:600;font-size:var(--fs-3);letter-spacing:-.006em;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);white-space:nowrap;transition:transform .2s var(--ease-spring),opacity .12s ease,box-shadow .2s}
.btn:active{transform:scale(.955);opacity:.9}
.btn-primary{background:linear-gradient(180deg, hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 4%)), var(--accent));border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm), 0 8px 20px hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.32)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn-danger{background:var(--fnj);border-color:var(--fnj);color:var(--fnj-ink)}
.btn-danger-ghost{border-color:var(--bad-bg);background:var(--bad-bg);color:var(--fnj)}
.btn-sm{min-height:34px;padding:0 12px;font-size:var(--fs-2)}
.btn-block{width:100%}
.btn-cta{min-height:50px;font-size:var(--fs-5);font-weight:700;gap:8px;white-space:normal;text-align:center;line-height:1.25;padding:10px 20px;background:linear-gradient(180deg, hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 6%)), var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 3px 0 hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 8%)), 0 10px 24px hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.4);transition:transform .15s var(--ease-spring),box-shadow .15s}
.btn-cta:active{transform:translateY(2px) scale(.98);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 1px 0 hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) - 8%)), 0 4px 12px hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.3)}
.btn-cta svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.incident-cta{padding:16px;display:grid;gap:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-block:2px 12px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:var(--fs-3);font-weight:600;color:var(--ink-2);white-space:nowrap;transition:transform .15s var(--ease-spring)}
.chip-dd{display:inline-flex;align-items:center;gap:6px}
.chip-caret{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-dd[aria-pressed="true"] .chip-caret{opacity:.9}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-block:24px 10px}
.empty{text-align:center;padding:42px 16px;color:var(--muted)}
.empty .h2{color:var(--ink);margin-bottom:8px}
.empty p{max-width:36ch;margin:0 auto 18px}
.rolepill{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:var(--fs-1);font-weight:700;letter-spacing:.02em}
.rolepill.dim{background:var(--surface-2);color:var(--muted)}

/* Roll call */
.ctx{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px;padding-block:4px 10px}
.session{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:4px}
.session-main{text-align:center;padding:6px 4px;border-radius:var(--r-md);min-width:0}
.session-prod{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-date{display:block;font-weight:700;font-size:21px;line-height:1.15;letter-spacing:-.01em;margin-block:2px}
.session-meta{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.badge.soft{background:var(--surface-2);color:var(--ink);font-weight:700;border:1px solid var(--line-strong)}
.nav-arrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.nav-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-arrow[disabled]{opacity:.3}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-top:14px}
@media (max-width:420px){.secs{grid-template-columns:repeat(2,1fr)}}
.sq{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);padding:16px 10px;min-height:128px;transition:transform .18s var(--ease-spring),background .15s}
.sq:active{transform:scale(.97);background:var(--surface-2)}
.sq:hover{background:var(--surface-2)}
.q-l{font-weight:800;font-size:var(--fs-9);line-height:1;letter-spacing:.04em;color:var(--accent)}
.q-n{font-size:13.5px;font-weight:600;margin-top:6px;text-align:center}
.q-c{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.q-c.done{display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;padding:2px 9px;border-radius:999px;margin-top:2px}
.q-bar{display:block;width:64%;height:5px;margin-top:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.q-bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.sq.is-done .q-bar span{background:var(--accent)}
.q-dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--p)}
.q-dot.pend{right:auto;left:12px;background:var(--fj)}
.sq.off{background:var(--surface-2)} .sq.off .q-l{color:var(--line-strong)} .sq.off .q-n,.sq.off .q-c{color:var(--muted)}
.leader{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-block:14px 8px;flex-wrap:wrap}
.leader b{color:var(--ink);font-weight:600}
.tally{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.s-P{background:var(--p)} .s-R{background:var(--r)} .s-FJ{background:var(--fj)} .s-FNJ{background:var(--fnj)} .s-NP{background:var(--np)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.i-P{background:var(--p)} .i-R{background:var(--r)} .i-FJ{background:var(--fj)} .i-FNJ{background:var(--fnj)} .i-NP{background:var(--np)} .i-none{background:transparent;border:1.5px dashed var(--line-strong)}
.tally-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.tcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border-radius:var(--r-md);background:var(--surface-2)}
.tcell.dim{opacity:.7}
.tcell i{width:8px;height:8px;border-radius:50%;margin-bottom:1px}
.tcell b{font-family:var(--f-mono);font-weight:600;font-size:19px;line-height:1;color:var(--ink)}
.tcell span{font-size:11px;color:var(--muted);white-space:nowrap}
.tally-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.progress-txt{font-size:13px;color:var(--muted)}
.progress-txt b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.roster{list-style:none;margin:14px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{padding:12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.who{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.name{font-weight:600;font-size:16px;line-height:1.25}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.part{align-self:center;flex:none;font-family:var(--f-mono);font-weight:500;font-size:11px;line-height:18px;padding:0 5px;border-radius:6px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap}
.state{font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:46px;padding:4px 2px;border-radius:10px;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.05;text-align:center;transition:transform .15s var(--ease-spring),background .15s,color .15s}
.opt i{width:8px;height:8px;border-radius:50%}
.opt:active{transform:scale(.96)}
.opt.o-P i{background:var(--p)} .opt.o-R i{background:var(--r)} .opt.o-FJ i{background:var(--fj)} .opt.o-FNJ i{background:var(--fnj)} .opt.o-NP i{background:var(--np)}
.opt[aria-checked="true"] i{background:currentColor;opacity:.9}
.opt.o-P[aria-checked="true"]{background:var(--p);color:var(--p-ink)}
.opt.o-R[aria-checked="true"]{background:var(--r);color:var(--r-ink)}
.opt.o-FJ[aria-checked="true"]{background:var(--fj);color:var(--fj-ink)}
.opt.o-FNJ[aria-checked="true"]{background:var(--fnj);color:var(--fnj-ink)}
.opt.o-NP[aria-checked="true"]{background:var(--np);color:var(--np-ink)}
.row.has-mark .opt[aria-checked="false"]{opacity:.62}
.extra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:10px;border-radius:10px}
.extra.x-R{background:var(--r-soft)} .extra.x-FJ{background:var(--fj-soft)} .extra.x-FNJ{background:var(--fnj-soft)}
.extra label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mins{display:flex;gap:6px;flex-wrap:wrap}
.min-chip{min-width:44px;height:34px;padding:0 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px}
.min-chip.min-custom{width:52px;text-align:center;color:var(--ink)}
.min-chip.min-custom::-webkit-inner-spin-button{opacity:.6}
.min-chip[aria-pressed="true"]{background:var(--r);border-color:var(--r);color:var(--r-ink);font-weight:500}
.note-input{flex:1 1 180px;min-width:0;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;font-size:16px}
.rowhint{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg);border:1px solid color-mix(in srgb, var(--warn-fg) 22%, transparent)}
.rowhint.done{background:var(--ok-bg);color:var(--ok-fg);border-color:color-mix(in srgb, var(--ok-fg) 22%, transparent)}

/* Calendar */
.cal-month{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:16px 2px 6px}
.cal-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cal-row{position:relative;display:flex;align-items:center;background-color:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.cal-row:first-child{border-top:0}
.cal-main{flex:1;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 14px 10px 12px;text-align:left;min-width:0}
.cal-date{display:flex;flex-direction:column;align-items:center;line-height:1}
.cal-date b{font-weight:700;font-size:20px}
.cal-date small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px}
.cal-info{min-width:0}
.cal-type{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-type em{font-style:normal;font-family:var(--f-mono);font-weight:400;font-size:12.5px;color:var(--muted);margin-left:4px}
.cal-place{font-size:12.5px;line-height:1.35;color:var(--muted)}
.cal-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-right:2px}
.vmarks{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:96px}
.vm{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:9px;border:1.5px solid var(--line-strong);color:var(--muted)}
.vm.full{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vm.part{border-color:var(--accent);color:var(--accent)}
.vm.off{border-style:dotted;opacity:.4}
.cal-pct{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.cal-row.is-today{background-color:var(--accent-soft)}
.cal-row.is-special{background-color:var(--surface-2)}
.cal-row.is-special.is-today{background-color:var(--accent-soft)}
.cal-star{color:var(--gold);margin-right:4px;font-size:11px}
.cal-row.is-today .cal-date b{color:var(--accent)}
.cal-row.is-past .cal-date b{color:var(--ink-2)}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-sm)}
.kpi-v{font-weight:700;font-size:var(--fs-9);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.kpi-l{font-size:var(--fs-2);color:var(--muted);margin-top:4px}
.dot-tag{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot-tag.gold{background:var(--gold)}
.dot-tag.red{background:var(--fnj)}
.kpi.great{background:radial-gradient(130% 130% at 25% 15%, color-mix(in srgb, var(--p) 24%, var(--surface)) 0%, var(--surface) 78%)}
.kpi.alert{background:radial-gradient(130% 130% at 25% 15%, color-mix(in srgb, var(--fnj) 15%, var(--surface)) 0%, var(--surface) 72%)}
.kpi.gold-box{background:radial-gradient(130% 130% at 25% 15%, color-mix(in srgb, var(--gold) 22%, var(--surface)) 0%, var(--surface) 78%)}
.kpi-details summary{cursor:pointer;list-style:none;position:relative;padding-right:20px}
.kpi-details summary::-webkit-details-marker{display:none}
.kpi-details summary::after{content:'';position:absolute;right:2px;top:8px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s var(--ease-out)}
.kpi-details[open] summary::after{transform:rotate(-135deg)}
.kpi-breakdown{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kpi-details[open]{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.kpi-details[open] summary{flex:none}
.kpi-details[open] .kpi-breakdown{margin-top:0}
.kpi-chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.kpi-chip.gold{background:var(--warn-bg);color:var(--warn-fg)}
.kpi-chip.red{background:var(--bad-bg);color:var(--bad-fg)}
.kpi.info{background:radial-gradient(130% 130% at 25% 15%, color-mix(in srgb, var(--r) 16%, var(--surface)) 0%, var(--surface) 78%)}
.mini-kpi.great{background:radial-gradient(130% 130% at 30% 20%, color-mix(in srgb, var(--p) 26%, var(--surface-2)) 0%, var(--surface-2) 80%)}
.mini-kpi.alert{background:radial-gradient(130% 130% at 30% 20%, color-mix(in srgb, var(--fnj) 18%, var(--surface-2)) 0%, var(--surface-2) 75%)}
.pill.risk{background:var(--fnj);color:#fff;font-weight:800}
.bars{display:grid;gap:12px;padding:14px}
.bar-row{display:grid;grid-template-columns:88px 1fr 44px;align-items:center;gap:10px;font-size:13.5px}
.bar-row .lbl{display:flex;align-items:baseline;gap:6px;font-weight:600;min-width:0}
.bar-row .lbl em{font-style:normal;font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--accent)}
.bar-row .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .val{font-family:var(--f-mono);font-size:13px;text-align:right}
.bar-total{padding-bottom:12px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.bar-total .lbl,.bar-total .val{font-weight:700;color:var(--ink)}
.stats-norm{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.mtable{list-style:none;margin:0;padding:0}
.mrow{border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow button{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:11px 14px;text-align:left;transition:background .15s}
.mrow button:active{background:var(--surface-2)}
.mrow .mname{display:inline-flex;align-items:baseline;gap:6px;min-width:0;font-weight:600;flex-wrap:wrap}
.mrow .mname span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sec-tag{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.mrow .mpct{font-family:var(--f-mono);font-size:14px;font-weight:500;text-align:right}
.mrow .stack{grid-column:1/-1;height:6px}
.mrow .mcounts{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mrow .mcounts i{width:7px;height:7px;border-radius:2px}
.mrow .mcounts b{font-family:var(--f-mono);font-weight:500;color:var(--ink-2)}
.mrow .mcounts span{display:inline-flex;align-items:center;gap:5px}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.alerts li:first-child{border-top:0}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.edit-hint{stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-left:2px;opacity:.6}
.pill.fnj{background:var(--bad-bg);color:var(--bad-fg)}
.pill.low{background:var(--warn-bg);color:var(--warn-fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.info{background:var(--info-bg);color:var(--info-fg)}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.hcell{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.hcell i{width:100%;height:22px;border-radius:5px;background:var(--surface-2);border:1px dashed var(--line-strong)}
.hcell i.s-P,.hcell i.s-R,.hcell i.s-FJ,.hcell i.s-FNJ,.hcell i.s-NP{border:0}
.privacy{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);font-size:12.5px;color:var(--muted);margin-top:10px}
.help-row{display:flex;gap:13px;align-items:flex-start;padding:13px 0}
.help-row + .help-row{border-top:1px solid var(--line)}
.help-row span{font-size:18px;flex:none;line-height:1;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.help-row div{font-size:13.5px;line-height:1.45;color:var(--ink-2);padding-top:6px}
.help-row b{color:var(--ink);font-size:14.5px;display:block;margin-bottom:2px}
.help-intro{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;color:var(--ink-2);margin:0 0 4px}

/* Profile */
.profile-head{display:flex;align-items:center;gap:14px;padding:16px;flex-wrap:wrap}
.mini-kpi{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 22px;border-radius:var(--r-md);background:var(--surface-2);flex:none}
.mini-kpi b{font-family:var(--f-mono);font-weight:700;font-size:28px;line-height:1.1;color:var(--ink)}
.mini-kpi span{font-size:11.5px;color:var(--muted);margin-top:3px}
.profile-head .logo{width:60px;height:60px;border-radius:18px;font-size:20px}
.gauge{display:grid;gap:8px;padding:14px}
.gauge-bar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}

function userFromRow(r) {
  return { id: r.id, username: r.username, name: r.name, section: r.section || '', instrument: r.instrument || '',
    roles: r.roles && r.roles.length ? r.roles : ['musician'], active: r.active !== false, mustChangePassword: !!r.must_change_password };
}
function projectFromRow(r) {
  return { id: r.id, name: r.name, color: r.color, from: r.from_date || '', to: r.to_date || '',
    repertoire: r.repertoire || '', excludedIds: r.excluded_ids || [], info: r.info || '' };
}
function sessionFromRow(r) {
  return { id: r.id, projIds: r.proj_ids || [], date: r.date, time: (r.time || '').slice(0, 5), end: (r.end_time || '').slice(0, 5),
    type: r.type || 'Assaig', place: r.place || '', note: r.note || '' };
}
function incidentFromRow(r) {
  return { id: r.id, userId: r.user_id, sessionId: r.session_id, kind: r.kind, min: r.min == null ? undefined : r.min,
    reason: r.reason || '', status: r.status, createdAt: r.created_at, reviewedBy: r.reviewed_by || undefined,
    reviewedAt: r.reviewed_at || undefined, reviewNote: r.review_note || '' };
}
function configFromRow(r) {
  if (!r) return structuredClone(DEFAULT.config);
  return { name: r.name, logo: r.logo || '', accentH: r.accent_h, maxFaltesPct: r.max_faltes_pct ?? 25,
    alertFNJ: r.alert_fnj, countLateAsPresent: r.count_late_as_present,
    places: r.places || [], types: (r.types && r.types.length) ? r.types : null };
}
function rowsToAttendance(rows) {
  const map = {};
  for (const r of rows) map[`${r.session_id}|${r.user_id}`] = { s: r.status, min: r.min == null ? undefined : r.min, note: r.note || undefined, by: r.marked_by || undefined, at: r.marked_at };
  return map;
}
function attendanceToRows(att) {
  return Object.entries(att).map(([k, v]) => {
    const [sessionId, userId] = k.split('|');
    return { sessionId, userId, s: v.s, min: v.min ?? '', note: v.note || '', by: v.by || '', at: v.at || '' };
  });
}
async function load() {
  try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || '{}')); } catch {}
  try { const s = JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); ME = s && s.userId; REAL_ADMIN = (s && s.realAdminId) || null; } catch {}
  try {
    const [{ data: users }, { data: projects }, { data: sessions }, { data: attendance }, { data: incidents }, { data: configRows }, { data: sectionRows }] = await Promise.all([
      sb.from('users_public').select('*'),
      sb.from('projects').select('*'),
      sb.from('sessions').select('*'),
      sb.from('attendance').select('*'),
      sb.from('incidents').select('*'),
      sb.from('config').select('*').limit(1),
      sb.from('sections').select('*'),
    ]);
    S.users = (users || []).map(userFromRow);
    S.projects = (projects || []).map(projectFromRow);
    S.sessions = (sessions || []).map(sessionFromRow);
    S.attendance = rowsToAttendance(attendance || []);
    S.incidents = (incidents || []).map(incidentFromRow);
    S.config = configFromRow(configRows && configRows[0]);
    applySections(sectionRows);
    if (S.config.types) TYPES = S.config.types;
  } catch (e) { console.warn(e); toast('No s\'ha pogut connectar amb el servidor'); }
  migrate();
  if (!S.users.length) await seedAdmin();
  if (ME && !S.users.some(u => u.id === ME && u.active !== false)) ME = null;
  ui.sessionId = null; ui.rollSec = null; ui.search = ''; ui.tab = null;
}
/** Comprovacions de seguretat mínimes; les dades ja arriben normalitzades des de Supabase. */
function migrate() {
  if (!Array.isArray(S.sessions)) S.sessions = [];
  S.sessions.forEach(s => { if (!Array.isArray(s.projIds)) s.projIds = []; });
}

  clearTimeout(t1);

        p_attendance: attendanceToRows(S.attendance), p_incidents: S.incidents });
      if (r1.error) throw r1.error;

/* ================= Usuaris, rols i permisos ================= */

/* ================= Sessions i assistència ================= */
const projById = id => S.projects.find(p => p.id === id) || null;
const projsOf = s => (s.projIds || []).map(projById).filter(Boolean);
const sessionsOfProj = pid => S.sessions.filter(s => (s.projIds || []).includes(pid)).sort((a, b) => a.date.localeCompare(b.date));
/** Estat d'un projecte segons les seves dates (o, si no en té, les de les seves sessions). */
const PROJECT_STATUS_LABEL = { done: 'Acabat', ongoing: 'En curs', upcoming: 'Proper' };

const ongoingProject = () => S.projects.find(p => projectStatus(p) === 'ongoing') || null;
function projectStatus(p) {

  const to = p.to || ss[ss.length - 1] || null;

}
function decorate(s) {

function allSessions() {

const sessionById = id => allSessions().find(s => s.id === id) || null;
/** Totes les seccions són sempre convocades a cada sessió. */
const convoked = () => true;
/** Un músic queda fora d'una sessió només si està descartat de TOTS els projectes als quals pertany la sessió. */
function excludedFrom(s, u) {
  const ps = projsOf(s);

  return ps.every(p => (p.excludedIds || []).includes(u.id));
}
const inSession = (s, u) => inCensus(u) && !excludedFrom(s, u);
const aKey = (sid, uidv) => `${sid}|${uidv}`;

  else S.attendance[k] = { ...val, by: ME, at: stamp() };

}
const emptyCounts = () => ({ P: 0, R: 0, FJ: 0, FNJ: 0, NP: 0, none: 0, total: 0 });
function countsFor(session, sec) {

  }

}
function rate(c) {
  const present = c.P + (S.config.countLateAsPresent ? c.R : 0);
  const den = c.P + c.R + c.FJ + c.FNJ;
  return den ? present / den : null;
}
/** Puntualitat: dels assajos on ha vingut, quants ha arribat a l'hora (no comptant les faltes). */
function punctualityRate(c) {
  const den = c.P + c.R;

}
/** De les faltes, quantes han quedat justificades. */
function justifiedRate(c) {

}
/** Barra de dos colors per a Estadístiques: assisteix + retard en verd, faltes (justificades o no) en vermell. */
function statBar(c) {
  const good = c.P + c.R, bad = c.FJ + c.FNJ, den = good + bad || 1;
  return `<div class="stack"><span class="s-P" style="width:${good / den * 100}%"></span><span class="s-FNJ" style="width:${bad / den * 100}%"></span></div>`;
}
/** Un únic requadre de faltes (justificades + no justificades), amb el desglossament amagat fins que es toca. Per a vistes personals. */
function faltesBox(c) {

}

function faltesPctBoxes(c) {

    <div class="kpi"><div class="kpi-v">${pnj == null ? '—' : pct(pnj)}</div><div class="kpi-l"><span class="dot-tag red"></span>Faltes no justificades</div></div>`;

function projStatsChips() {

}
function sessionCounts(session) {
  const c = emptyCounts();
  for (const x of SECTIONS) { if (!convoked(session, x.id)) continue; const s = countsFor(session, x.id); for (const k of Object.keys(c)) c[k] += s[k]; }
  return c;
}
const hasData = (session, sec) => { const c = countsFor(session, sec); return c.total > 0 && c.none < c.total; };
function doneSessions(projFilter) {
  return allSessions().filter(s => (!projFilter || projFilter === 'all' || (s.projIds || []).includes(projFilter)) && s.date <= TODAY
    && SECTIONS.some(x => convoked(s, x.id) && hasData(s, x.id)));
}
function userStats(u, sessions) {
  const c = emptyCounts(); const hist = [];
  for (const s of sessions) {
    if (!inSession(s, u)) continue;
    const mk = mark(s.id, u.id); if (!mk) continue;
    c[mk.s]++; c.total++; hist.push({ date: s.date, s: mk.s, sid: s.id });
  }
  return { c, hist, pct: rate(c) };
}
const minPunctRate = () => (S.config.minPunctuality || 80) / 100;
const maxFaltesRate = () => (S.config.maxFaltesPct ?? 25) / 100;
/** Percentatge de faltes (justificades + no justificades) sobre el total de convocatòries marcades. */
/** Total de sessions (fetes o no) dins de l'abast actual (un projecte concret, o tot el curs). */
function totalSessionsForScope(projFilter) {
  return allSessions().filter(s => !projFilter || projFilter === 'all' || (s.projIds || []).includes(projFilter)).length;
}
/** Percentatge de faltes (justificades + no justificades) sobre el total de convocatòries marcades.
 *  El marge d'assajos abans de valorar-ho escala amb la mida del projecte: en un de 14 assajos amb un 25% de
 *  faltes permeses, el marge natural és de 3 faltes, així que també s'esperen 3 assajos abans de jutjar-ho;
 *  en un de 6 assajos el marge (i per tant l'espera) és menor. Mentre no hi hagi prou mostra, retorna null
 *  (ni verd ni vermell). */
function faltesShare(c) {
  const den = c.P + c.R + c.FJ + c.FNJ;

  const minNeeded = Math.max(1, Math.floor(totalExpected * maxFaltesRate()));

const instrumentBadge = inst => inst ? ` <span class="part">${esc(inst)}</span>` : '';

    const done = on && c.total > 0 && c.none === 0;
    const pend = S.incidents.some(inc => inc.sessionId === cur.id && inc.status === 'pending' && (userById(inc.userId) || {}).section === x.id);
    return `<button class="sq ${on ? '' : 'off'}" data-act="open-sec" data-sec="${x.id}" ${on ? '' : 'disabled'}>
      ${pend ? '<span class="q-dot pend" title="Avisos pendents"></span>' : ''}
      <span class="q-l">${esc(x.icon) || x.id}</span><span class="q-n">${x.name}</span>
      <span class="q-c ${done ? 'done' : ''}">${on ? `${c.total - c.none}/${c.total}` : 'no convocada'}</span></button>`;
  }).join('');
  const c = sessionCounts(cur);
  const started = c.total > 0 && c.none < c.total;
  const showPanel = started || can.manageProjects();
  return `<div class="secs">${cards}</div>
    ${showPanel ? `<div class="tally" style="margin-top:16px">
      ${started ? `<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-top:0"><div class="kpi ${riskClass(c)}"><div class="kpi-v">${pct(rate(c))}</div><div class="kpi-l">Assistència</div></div>
        <div class="kpi ${punctClass(punctualityRate(c))}"><div class="kpi-v">${pct(punctualityRate(c))}</div><div class="kpi-l">Puntualitat</div></div>
        <div class="kpi"><div class="kpi-v">${c.P + c.R}/${c.total}</div><div class="kpi-l">Presents</div></div></div>` : ''}
      ${can.manageProjects() ? `<div class="tally-foot"><span class="spacer"></span><button class="btn btn-sm" data-act="sess-edit" data-sid="${cur.id}">Edita la sessió</button></div>` : ''}</div>` : ''}`;
}
function stackBar(c) {
  const den = c.total || 1;
  return `<div class="stack">${ORDER.map(k => c[k] ? `<span class="s-${k}" style="width:${(c[k] / den) * 100}%"></span>` : '').join('')}</div>`;
}
/** Resum numèric per estat (en comptes d'una barra de colors amb amplades relatives, més difícil de llegir d'un cop d'ull). */
function tallyGrid(c) {
  const present = (c.P || 0) + (c.R || 0);
  const faltes = (c.FJ || 0) + (c.FNJ || 0);
  const cells = [present ? `<div class="tcell"><i class="i-P"></i><b>${present}</b><span>Present</span></div>` : '',
    faltes ? `<div class="tcell"><i class="i-FNJ"></i><b>${faltes}</b><span>Falta</span></div>` : ''].join('');
  const pending = c.none ? `<div class="tcell dim"><i class="i-none"></i><b>${c.none}</b><span>Per marcar</span></div>` : '';
  return `<div class="tally-grid">${cells}${pending}</div>`;
}
function rollSection(cur, sec, fixed) {
  const ms = membersOf(sec).filter(u => inSession(cur, u));
  const c = countsFor(cur, sec);
  const started = c.total > 0 && c.none < c.total;
  const head = `<div class="leader"><span>Secció: <b>${esc(SEC[sec].name)}</b></span>
    ${fixed ? '' : '<button class="btn btn-sm" data-act="close-sec">← Totes les seccions</button>'}</div>`;
  if (!convoked(cur, sec)) return head + `<div class="empty"><h2 class="h2">Secció no convocada</h2><p>Aquesta sessió no convoca ${esc(SEC[sec].name.toLowerCase())}.</p></div>`;
  if (!ms.length) return head + `<div class="empty"><h2 class="h2">Cap músic</h2><p>Afegeix músics a aquesta secció des de Gestió.</p></div>`;
  const showPanel = started || (c.none && can.section(sec));
  return head + `${showPanel ? `<div class="tally">
      ${started ? `<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-top:0"><div class="kpi ${riskClass(c)}"><div class="kpi-v">${pct(rate(c))}</div><div class="kpi-l">Assistència</div></div>
        <div class="kpi ${punctClass(punctualityRate(c))}"><div class="kpi-v">${pct(punctualityRate(c))}</div><div class="kpi-l">Puntualitat</div></div>
        <div class="kpi"><div class="kpi-v">${c.P + c.R}/${c.total}</div><div class="kpi-l">Presents</div></div></div>` : ''}
      ${c.none && can.section(sec) ? `<div class="tally-foot"><span class="spacer"></span><button class="btn btn-sm btn-primary" data-act="rest-present" data-sec="${sec}">Marca tots els músics com a presents</button></div>` : ''}</div>` : ''}
    <ul class="roster">${ms.map(m => rollRow(cur, m)).join('')}</ul>`;
}
function statusPill(mk) {
  if (!mk) return '<span class="state">Per marcar</span>';
  const cls = mk.s === 'P' ? 'ok' : mk.s === 'R' ? 'info' : mk.s === 'FNJ' ? 'fnj' : 'low';
  return `<span class="pill ${cls}">${STATUS[mk.s].label}${mk.s === 'R' && mk.min ? ` ${mk.min}′` : ''}</span>`;
}
function rollRow(session, m) {
  const mk = mark(session.id, m.id); const s = mk?.s || 'none';
  const canMark = can.section(m.section);
  const inc = S.incidents.find(i => i.sessionId === session.id && i.userId === m.id);
  const opts = ORDER.filter(k => k !== 'NP').map(k => `<button class="opt o-${k}" role="radio" aria-checked="${s === k}" data-act="mark" data-mid="${m.id}" data-s="${k}"><i></i><span>${STATUS[k].short}</span></button>`).join('');
  let extra = '';
  if (s === 'R') extra = `<div class="extra x-R"><label>Minuts</label><div class="mins">
      ${LATE_CHIPS.map(n => `<button class="min-chip" aria-pressed="${mk.min === n}" data-act="min" data-mid="${m.id}" data-min="${n}">${n}′</button>`).join('')}
      <input type="number" class="min-chip min-custom" aria-pressed="${mk.min && !LATE_CHIPS.includes(mk.min) ? 'true' : 'false'}" inputmode="numeric" min="1" max="180" placeholder="+" value="${mk.min && !LATE_CHIPS.includes(mk.min) ? mk.min : ''}" data-act="min-custom" data-mid="${m.id}"></div>
      <input class="note-input" placeholder="Nota (opcional)" data-act="note" data-mid="${m.id}" value="${esc(mk.note || '')}"></div>`;
  else if (s === 'FJ') extra = `<div class="extra x-FJ"><label>Motiu</label>
      <input class="note-input" placeholder="Feina, malaltia, examen…" data-act="note" data-mid="${m.id}" value="${esc(mk.note || '')}"></div>`;
  return `<li class="row ${mk ? 'has-mark' : ''}" data-s="${s}">
    <div class="row-top"><span class="who"><span class="name">${esc(m.name)}</span>
      ${m.instrument ? `<span class="part">${esc(m.instrument)}</span>` : ''}${hasRole(m, 'leader') ? '<span class="tag">Cap de secció</span>' : ''}
      ${inc ? `<button class="rowhint ${inc.status === 'pending' ? '' : 'done'}" data-act="inc-open" data-id="${inc.id}">${inc.status === 'pending' ? 'Avís pendent' : inc.kind === 'late' ? 'Retard avisat' : 'Absència avisada'}</button>` : ''}</span>
      ${statusPill(mk)}</div>
    ${canMark ? `<div class="seg" role="radiogroup">${opts}</div>${extra}` : ''}</li>`;
}

/* ---------- Calendari ---------- */
function viewCal() {
  const u = me();
  const bar = `<div class="subtabs"><button class="subtab" aria-selected="${ui.calMode !== 'projects'}" data-act="cal-mode" data-id="sessions">Sessions</button>
    <button class="subtab" aria-selected="${ui.calMode === 'projects'}" data-act="cal-mode" data-id="projects">Projectes</button></div>`;
  if (ui.calMode === 'projects') {
    return `<div class="page-head"><h1 class="h1">Calendari</h1>
      <span style="display:flex;gap:8px">
        <button class="icon-btn" data-act="cal-subscribe" aria-label="Subscriu-te al calendari">${ICON.calSub}</button>
        ${can.manageProjects() ? '<button class="btn btn-sm btn-primary" data-act="new-proj">+ Projecte</button>' : ''}</span></div>${bar}${viewProjects()}`;
  }
  const all = allSessions();
  if (!all.length) return `<div class="page-head"><h1 class="h1">Calendari</h1></div>${bar}
    <div class="empty"><h2 class="h2">Sense sessions</h2><p>Encara no hi ha assajos ni concerts programats.</p>
    ${can.manageProjects() ? '<button class="btn btn-primary" data-act="new-proj">+ Nou projecte</button>' : ''}</div>`;
  const cp = S.projects.find(x => x.id === ui.calProj) || (ui.calProj === 'all' ? ongoingProject() : null);
  const chips = `<div class="chips"><button class="chip" aria-pressed="${ui.calProj === 'all'}" data-act="cal-proj" data-id="all">Tot</button>
    ${S.projects.length ? `<button class="chip chip-dd" aria-pressed="${ui.calProj !== 'all'}" data-act="pick-proj" data-scope="cal">${cp ? `<span class="pdot" style="background:${esc(cp.color)}"></span>${esc(cp.name)}` : 'Un projecte'}${ICON.caret}</button>` : ''}
    <button class="chip" aria-pressed="${ui.calPast}" data-act="cal-past">Anteriors</button></div>`;
  let list = all.filter(s => ui.calProj === 'all' || (s.projIds || []).includes(ui.calProj));
  if (!ui.calPast) list = list.filter(s => s.date >= TODAY);
  let out = '', month = '';
  for (const s of list) {
    const my = monthYear(s.date);
    if (my !== month) { out += (month ? '</ul>' : '') + `<div class="cal-month">${my}</div><ul class="cal-list">`; month = my; }
    const mine = inSession(s, u);
    const mk = inCensus(u) ? mark(s.id, u.id) : null;
    let right = '';
    if (mk) right += `<span class="pill ${mk.s === 'P' ? 'ok' : mk.s === 'R' ? 'info' : mk.s === 'FNJ' ? 'fnj' : 'low'}">${STATUS[mk.s].short}</span>`;
    else if (inCensus(u) && !mine) right += `<span class="cal-pct muted">No hi toques</span>`;
    if (viewOnly(u) && s.date < TODAY) { const c = sessionCounts(s); if (c.total > 0 && c.none < c.total) right += `<span class="cal-pct">${pct(rate(c))}</span>`; }
    const isSpecial = !(s.type || 'Assaig').toLowerCase().startsWith('assaig');
    out += `<li class="cal-row ${s.date === TODAY ? 'is-today' : ''} ${s.date < TODAY ? 'is-past' : ''} ${isSpecial ? 'is-special' : ''}" style="${s.projs.length ? `border-left:7px solid ${esc(s.projs[0].color)}` : ''}">
      <button class="cal-main" data-act="sess-info" data-sid="${s.id}">
        <span class="cal-date"><b>${Number(s.date.slice(8, 10))}</b><small>${wdShort(s.date)}</small></span>
        <span class="cal-info"><span class="cal-type">${isSpecial ? '<span class="cal-star">★</span>' : ''}${esc(s.type || 'Assaig')}<em>${esc(timeRange(s))}</em></span>
          ${s.place ? `<span class="cal-place">${esc(s.place)}</span>` : ''}
          <span class="cal-projs">${s.projs.map(pr => `<span class="cal-tagp" style="background:${esc(pr.color)}22;color:${esc(pr.color)}">${esc(pr.name)}</span>`).join('')}</span></span>
        <span class="cal-right">${right}</span></button></li>`;
  }
  out += list.length ? '</ul>' : '<div class="empty"><p>Cap sessió amb aquests filtres.</p></div>';
  return `<div class="page-head"><h1 class="h1">Calendari</h1>
    <span style="display:flex;gap:8px">
      <button class="icon-btn" data-act="cal-subscribe" aria-label="Subscriu-te al calendari">${ICON.calSub}</button>
      ${can.manageProjects() ? '<button class="btn btn-sm btn-primary" data-act="new-session">+ Sessió</button>' : ''}</span></div>${bar}${chips}${out}`;
}
/** Llista de projectes: gestió completa per a Junta/administració, consulta amb estat per a la resta. */
function viewProjects() {
  const editable = can.manageProjects();
  const head = `<div class="sec-h"><span class="muted" style="font-size:13px">${S.projects.length} projectes</span></div>`;
  if (!S.projects.length) return head + `<div class="empty"><h2 class="h2">Cap projecte</h2>
    <p>Un projecte agrupa les dates, el repertori, els músics implicats i els assajos.</p></div>`;
  const byEnd = (a, b) => (a.to || '9999') < (b.to || '9999') ? -1 : (a.to || '9999') > (b.to || '9999') ? 1 : 0;
  const ongoing = S.projects.filter(p => projectStatus(p) === 'ongoing').sort(byEnd);
  const rest = S.projects.filter(p => projectStatus(p) !== 'ongoing').sort(byEnd);
  const sorted = [...ongoing, ...rest];
  return head + sorted.map(p => {
    const ss = sessionsOfProj(p.id);
    const rehearsals = ss.filter(s => s.type !== 'Concert');
    const done = rehearsals.filter(s => s.date <= TODAY).length;
    const st = projectStatus(p);
    const inner = `<span class="h2"><span class="pdot" style="background:${esc(p.color)}"></span>${esc(p.name)}<span class="status-badge ${st}">${PROJECT_STATUS_LABEL[st]}</span></span>
        <span class="prod-meta">${p.from ? `<span>${esc(ddmm(p.from))}${p.to ? ' – ' + esc(ddmm(p.to)) : ''}</span>` : ''}
          <span>${done}/${rehearsals.length} assajos fets</span>
          </span>`;
    return `<div class="panel prod-card" style="margin-bottom:12px;border-left:7px solid ${esc(p.color)}">
      <button data-act="${editable ? 'edit-proj' : 'view-proj'}" data-pid="${p.id}">${inner}</button>
      ${editable ? `<div style="display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px">
        <button class="btn btn-sm" data-act="repeat-sessions" data-pid="${p.id}">Assajos setmanals</button>
        <button class="btn btn-sm btn-ghost" data-act="list-sessions" data-pid="${p.id}">Sessions</button></div>` : ''}</div>`;
  }).join('');
}

/* ---------- Estadístiques ---------- */
function viewStats() {
  const scope = statsScope();
  const u = me();
  if (scope === 'self') return statsSelf(u);
  if (scope === 'section') return viewStatsLeader(u);
  const sessions = doneSessions(ui.statsProj);
  const chips = projStatsChips();
  if (!sessions.length) return `<div class="page-head"><h1 class="h1">Estadístiques</h1></div>${chips}
    <div class="empty"><h2 class="h2">Encara no hi ha dades</h2><p>Les estadístiques d'aquest projecte apareixeran aquí.</p></div>`;
  const total = emptyCounts();
  for (const s of sessions) { const c = sessionCounts(s); for (const k of Object.keys(total)) total[k] += c[k]; }
  const stats = censusUsers().map(m => ({ m, ...userStats(m, sessions) })).filter(x => x.c.total);
  // Norma de risc: assistència per sota del mínim configurat (independentment de si les faltes són justificades).
  const risky = stats.filter(atRisk);
  const kpis = `<div class="kpis">
    <div class="kpi ${riskClass(total)}"><div class="kpi-v">${pct(rate(total))}</div><div class="kpi-l">Assistència</div></div>
    <div class="kpi ${punctClass(punctualityRate(total))}"><div class="kpi-v">${pct(punctualityRate(total))}</div><div class="kpi-l">Puntualitat</div></div>
    ${faltesPctBoxes(total)}</div>`;

  const globalBlock = `<div class="section-title"><h2 class="h2">Per secció</h2><span class="eyebrow">assistència</span></div>
    <div class="panel bars">
      <div class="bar-row bar-total"><span class="lbl"><span>General</span></span>${statBar(total)}<span class="val">${pct(rate(total))}</span></div>
      ${SECTIONS.map(x => {
        const c = emptyCounts();
        for (const m of membersOf(x.id)) { const st = userStats(m, sessions); for (const k of Object.keys(c)) c[k] += st.c[k]; }
        return `<div class="bar-row"><span class="lbl"><span>${x.name}</span></span>${statBar(c)}<span class="val">${pct(rate(c))}</span></div>`;
      }).join('')}</div>`;

  const named = risky.filter(x => can.seeRisk(x.m));
  const hidden = risky.length - named.length;
  const riskBlock = risky.length ? `<div class="section-title"><h2 class="h2">En risc</h2><span class="eyebrow">${risky.length}</span></div>
    <ul class="alerts panel">${named.sort((a, b) => (a.pct ?? 1) - (b.pct ?? 1)).map(x => `<li>
      <span class="mname"><span>${esc(x.m.name)}</span>${instrumentBadge(x.m.instrument)}</span>
      <span class="pill low">${pct(x.pct)}</span></li>`).join('')}
      ${hidden ? `<li><span class="muted">${hidden} músic${hidden > 1 ? 's' : ''} d'altres seccions en risc</span><span class="pill low">reservat</span></li>` : ''}</ul>
      ${hidden ? '<div class="privacy">Els noms dels músics en risc només els veuen la persona afectada, el seu cap de secció, la direcció, la Junta i l\'administració.</div>' : ''}` : '';

  const rows = stats.filter(x => can.seeMember(x.m) && (!ui.statsSec || x.m.section === ui.statsSec)).sort((a, b) => (a.pct ?? 1) - (b.pct ?? 1))
    .map(x => `<li class="mrow"><button data-act="member-detail" data-mid="${x.m.id}">
      <span class="mname"><span>${esc(x.m.name)}</span>${x.m.instrument ? `<span class="part">${esc(x.m.instrument)}</span>` : ''}</span>
      <span class="mpct" style="${atRisk(x) ? 'color:var(--fnj)' : ''}">${pct(x.pct)}</span>${statBar(x.c)}
      <span class="mcounts"><span><i class="i-P"></i>Assistència <b>${x.c.P + x.c.R}</b></span><span><i class="i-FNJ"></i>Faltes <b>${x.c.FJ + x.c.FNJ}</b></span></span></button></li>`).join('');
  const secChips = `<div class="chips"><button class="chip" aria-pressed="${!ui.statsSec}" data-act="stats-sec" data-sec="">Totes</button>
    ${SECTIONS.map(x => `<button class="chip" aria-pressed="${ui.statsSec === x.id}" data-act="stats-sec" data-sec="${x.id}">${x.name}</button>`).join('')}</div>`;

  const mineBlock = inCensus(u) ? (() => {
    const st = userStats(u, sessions);
    return `<div class="section-title"><h2 class="h2">Les meves dades</h2></div>${statsSelfKpis(st)}`;
  })() : '';

  return `<div class="page-head"><h1 class="h1">Estadístiques</h1><span class="eyebrow">Banda</span></div>
    ${chips}${mineBlock}
    <div class="section-title"><h2 class="h2">General</h2></div>${kpis}${globalBlock}${riskBlock}
    <div class="section-title"><h2 class="h2">Per músic</h2></div>
    ${secChips}<ul class="mtable panel">${rows || '<li class="empty">Cap músic amb dades.</li>'}</ul>`;
}
/** Per a caps de secció: la seva vista personal i la de la seva secció, a la mateixa pàgina, sense pestanyes. */
function viewStatsLeader(u) {
  const chips = projStatsChips();
  const sessions = doneSessions(ui.statsProj);
  if (!sessions.length) return `<div class="page-head"><h1 class="h1">Estadístiques</h1></div>${chips}<div class="empty"><p>Encara no hi ha dades amb aquest filtre.</p></div>`;

  const st = userStats(u, sessions);
  const secC = emptyCounts();
  for (const m of membersOf(u.section)) { const x = userStats(m, sessions); for (const k of Object.keys(secC)) secC[k] += x.c[k]; }
  const mineKpis = statsSelfKpis(st);

  const stats = membersOf(u.section).map(m => ({ m, ...userStats(m, sessions) })).filter(x => x.c.total);
  const sectionKpis = `<div class="kpis">
    <div class="kpi ${riskClass(secC)}"><div class="kpi-v">${pct(rate(secC))}</div><div class="kpi-l">Assistència</div></div>
    <div class="kpi ${punctClass(punctualityRate(secC))}"><div class="kpi-v">${pct(punctualityRate(secC))}</div><div class="kpi-l">Puntualitat</div></div>
    ${faltesPctBoxes(secC)}</div>`;
  const rows = stats.slice().sort((a, b) => (a.pct ?? 1) - (b.pct ?? 1))
    .map(x => `<li class="mrow"><button data-act="member-detail" data-mid="${x.m.id}">
      <span class="mname"><span>${esc(x.m.name)}</span>${x.m.instrument ? `<span class="part">${esc(x.m.instrument)}</span>` : ''}</span>
      <span class="mpct" style="${atRisk(x) ? 'color:var(--fnj)' : ''}">${pct(x.pct)}</span>${statBar(x.c)}</button></li>`).join('');
  const sectionBlock = sectionKpis + `<div class="panel bars" style="margin-top:10px"><ul class="mtable" style="margin:0">${rows || '<li class="empty">Cap músic amb dades.</li>'}</ul></div>`;

  return `<div class="page-head"><h1 class="h1">Estadístiques</h1></div>${chips}
    <div class="section-title"><h2 class="h2">Les meves dades</h2></div>${mineKpis}
    <div class="section-title"><h2 class="h2">La meva secció</h2><span class="eyebrow">${SEC[u.section]?.name || ''}</span></div>${sectionBlock}`;
}
function statsSelf(u) {
  const chips = projStatsChips();
  const sessions = doneSessions(ui.statsProj);
  const st = userStats(u, sessions);
  return `<div class="page-head"><h1 class="h1">Les meves dades</h1></div>${chips}${statsSelfKpis(st)}`;
}
/** Els tres requadres personals (assistència, puntualitat, faltes) — sense el desglossament ni el comparatiu. */
function statsSelfKpis(st) {
  return `<div class="kpis"><div class="kpi ${attClass(st)}"><div class="kpi-v">${pct(st.pct)}</div><div class="kpi-l">Assistència${atRisk(st) ? ' <span class="pill risk">En risc</span>' : ''}</div></div>
      <div class="kpi ${punctClass(punctualityRate(st.c))}"><div class="kpi-v">${pct(punctualityRate(st.c))}</div><div class="kpi-l">Puntualitat</div></div>
      ${faltesBox(st.c)}</div>`;
}

/* ---------- Perfil ---------- */
function viewProfile(targetId) {
  const u = targetId ? userById(targetId) : me();
  if (!u) return '';
  const own = u.id === ME;
  const incs = S.incidents.filter(i => i.userId === u.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const st = inCensus(u) ? userStats(u, doneSessions('all')) : null;
  return `<div class="page-head"><h1 class="h1">Perfil</h1></div>
    <div class="panel profile-head">
      <div style="min-width:0;flex:1"><div class="h2">${esc(u.name)}</div>
        <div class="muted" style="font-size:13px">${esc(sectionLabel(u))}${u.instrument ? ' · ' + esc(u.instrument) : ''}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${roleBadges(u)}
        ${inCensus(u) ? '' : '<span class="rolepill dim">No compta a l\'assistència</span>'}</div></div>
      ${st ? `<div class="mini-kpi ${attClass(st)}"><b>${pct(st.pct)}</b><span>Assistència</span></div>` : ''}</div>
    ${own && inCensus(u) ? `<div class="panel incident-cta" style="margin-top:16px">
        <button class="btn btn-primary btn-block btn-cta" data-act="new-incident">Comunica una absència o un retard</button></div>` : ''}
    <div class="section-title"><h2 class="h2">Els meus avisos</h2><span class="eyebrow">${incs.length}</span></div>
    <div class="panel">${incs.length ? incs.map(i => incCard(i, false)).join('') : '<div class="empty" style="padding:24px"><p>Cap absència ni retard comunicats.</p></div>'}</div>
    ${(() => {
      if (!own || !u.section) return '';
      const nextSess = allSessions().find(s => s.date >= TODAY && inSession(s, u));
      if (!nextSess) return '';
      const justified = S.incidents.filter(i => i.sessionId === nextSess.id && i.status === 'accepted' && i.userId !== u.id && (userById(i.userId) || {}).section === u.section);
      if (!justified.length) return '';
      return `<div class="section-title"><h2 class="h2">Pròxim assaig</h2><span class="eyebrow">${capz(ddmm(nextSess.date))}</span></div>
        <div class="panel" style="padding:14px"><div class="muted" style="font-size:13px;margin-bottom:8px">Ja han justificat que no hi seran:</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${justified.map(i => `<span class="part">${esc(userById(i.userId).name)}</span>`).join('')}</div></div>`;
    })()}
    ${own && u.section ? `<div class="section-title"><h2 class="h2">La meva secció</h2><span class="eyebrow">${SEC[u.section].name}</span></div>
      <ul class="list">${(() => {
        const ordered = membersOf(u.section);
        return ordered.map(m => `<li class="li" style="padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center">
          <span><span class="t">${esc(m.name)}</span>${m.instrument ? ` <span class="part">${esc(m.instrument)}</span>` : ''}</span>
          <span style="font-size:12.5px">${[hasRole(m, 'leader') ? '<b style="color:var(--accent)">Cap de secció</b>' : '', hasRole(m, 'board') ? 'Junta' : ''].filter(Boolean).join(', ')}</span></li>`).join('') || '<li class="li" style="padding:14px"><span class="muted">Ets l\'únic músic d\'aquesta secció.</span></li>';
      })()}</ul>` : ''}
    ${own ? `<div class="section-title"><h2 class="h2">Compte</h2></div>
      <div class="panel"><div class="setting"><div><div class="t">Credencials</div><div class="s">Usuari <b class="mono">${esc(u.username)}</b></div></div>
          <button class="btn btn-sm" data-act="change-password">Canvia la contrasenya</button></div>
        <div class="setting"><div><div class="t">Sessió</div><div class="s">Tanca la sessió en aquest dispositiu.</div></div>
          <button class="btn btn-sm" data-act="logout">Surt</button></div></div>` : ''}`;
}
function incCard(i, review) {
  const u = userById(i.userId); const s = sessionById(i.sessionId);
  const rev = i.reviewedBy ? userById(i.reviewedBy) : null;
  const canAct = can.reviewIncident(i);
  return `<div class="inc-card"><div class="inc-h"><b>${esc(u ? u.name : '—')}${review && u && u.instrument ? ` <span class="part">${esc(u.instrument)}</span>` : ''}</b>
      <span class="st-pill st-${i.status}">${i.status === 'pending' ? 'Pendent' : i.status === 'accepted' ? 'Justificada' : 'No justificada'}</span></div>
    <div class="inc-m"><span class="pill ${i.kind === 'late' ? 'info' : 'low'}">${i.kind === 'late' ? 'Retard' : 'Absència'}</span>${i.kind === 'late' && i.min ? ` de ${i.min}′` : ''} · ${s ? `${capz(longDate(s.date))} · ${esc(s.type || '')}` : 'sessió eliminada'}</div>
    <div class="inc-m">Comunicat el ${fmtStamp(i.createdAt)}${rev ? ` · revisat per ${esc(rev.name)} el ${fmtStamp(i.reviewedAt)}` : ''}</div>
    ${i.reason && i.status !== 'rejected' ? `<div style="font-size:13.5px">${esc(i.reason)}</div>` : ''}
    ${i.reviewNote ? `<div class="inc-m">Nota: ${esc(i.reviewNote)}</div>` : ''}
    ${review && canAct && i.status === 'pending' ? `<div class="inc-a">
      <button class="btn btn-sm btn-primary" data-act="inc-accept" data-id="${i.id}">Justifica</button>
      <button class="btn btn-sm btn-danger-ghost" data-act="inc-reject" data-id="${i.id}">Denega</button></div>` : ''}
    ${review && canAct && i.status !== 'pending' ? `<div class="inc-a"><button class="btn btn-sm btn-ghost" data-act="inc-reopen" data-id="${i.id}">Torna-la a pendent</button></div>` : ''}</div>`;
}

/* ---------- Gestió ---------- */
function viewManage() {
  const u = me(); const lvl = level(u);
  const tabs = [['usuaris', lvl >= 3 ? 'Usuaris' : 'La meva secció']];
  if (can.appConfig()) tabs.push(['config', 'Configuració']);
  if (!tabs.some(t => t[0] === ui.manage)) ui.manage = 'usuaris';
  const bar = tabs.length > 1 ? `<div class="subtabs">${tabs.map(([id, n]) => `<button class="subtab" aria-selected="${ui.manage === id}" data-act="manage" data-id="${id}">${n}</button>`).join('')}</div>` : '';
  const body = { usuaris: manageUsers, config: manageConfig }[ui.manage]();
  return `<div class="page-head"><h1 class="h1">Gestió</h1><span class="eyebrow">${esc(ROLES[topRole(u)].name)}</span></div>${bar}${body}`;
}
function manageUsers() {
  const u = me(); const lvl = level(u);
  const secs = lvl >= 3 ? SECTIONS.map(x => x.id) : [u.section];
  const q = normText(ui.search);
  const head = `<div class="sec-h"><span class="muted" style="font-size:13px">${lvl >= 3 ? `${S.users.filter(x => x.active !== false).length} usuaris · ${censusUsers().length} al cens` : `${membersOf(u.section).length} músics a la teva secció`}</span>
    <span style="display:flex;gap:6px">${can.createUsers() ? '<button class="btn btn-sm btn-primary" data-act="new-user">+ Usuari</button>' : ''}</span></div>
    <input class="search" id="usearch" placeholder="Cerca…" value="${esc(ui.search)}">`;
  const blocks = secs.map(sid => {
    const list = S.users.filter(x => x.section === sid && (!q || normText(x.name).includes(q) || normText(x.username).includes(q))).sort(byInstrumentOrder(sid));
    if (!list.length && q) return '';
    return `<div class="sec-h"><h2 class="h2">${SEC[sid].name}</h2>
        <span style="display:flex;align-items:center;gap:10px"><span class="muted mono" style="font-size:12.5px">${list.length}</span>
        ${can.createUsers() ? `<button class="btn btn-sm btn-ghost" data-act="new-user" data-sec="${sid}">+ Afegeix-ne</button>` : ''}</span></div>
      ${list.length ? `<ul class="list">${list.map(userRow).join('')}</ul>`
        : `<div class="panel" style="padding:14px;color:var(--muted);font-size:13.5px">Cap músic en aquesta secció.</div>`}`;
  }).join('');
  const staff = lvl >= 3 ? (() => {
    const dirs = S.users.filter(x => !x.section && topRole(x) === 'director' && (!q || normText(x.name).includes(q))).sort(bySurname);
    const adms = S.users.filter(x => !x.section && topRole(x) === 'admin' && (!q || normText(x.name).includes(q))).sort(bySurname);
    const block = (title, list) => list.length ? `<div class="sec-h"><h2 class="h2">${title}</h2><span class="muted mono" style="font-size:12.5px">${list.length}</span></div>
      <ul class="list">${list.map(userRow).join('')}</ul>` : '';
    return block('Direcció', dirs) + block('Administració', adms);
  })() : '';
  return head + blocks + staff;
}
function userRow(x) {
  const shown = rolesOf(x).filter(r => r !== 'musician');
  const roleHtml = shown.length
    ? ' · ' + shown.map(r => r === 'leader' ? `<b style="color:var(--accent)">${ROLES[r].name}</b>` : ROLES[r].name).join(', ')
    : '';
  const meta = `${roleHtml}${x.active === false ? (roleHtml ? ' · ' : '') + 'inactiu' : ''}`;
  return `<li class="li"><button data-act="edit-user" data-uid="${x.id}">
    <span class="${x.active === false ? 'dim' : ''}" style="min-width:0"><span class="t">${esc(x.name)}</span>
      ${x.instrument ? ` <span class="part">${esc(x.instrument)}</span>` : ''}
      ${meta ? `<span class="s">${meta}</span>` : ''}</span>
    <span class="icon-btn plain">${ICON.edit}</span></button></li>`;
}
function manageIncidents() {
  const mine = S.incidents.filter(i => can.viewIncidents(i)).sort((a, b) => {
    const da = (sessionById(a.sessionId) || {}).date || '9999', db = (sessionById(b.sessionId) || {}).date || '9999';
    return da < db ? -1 : da > db ? 1 : b.createdAt.localeCompare(a.createdAt);
  });
  const list = ui.incFilter === 'all' ? mine : mine.filter(i => i.status === ui.incFilter);
  return `<div class="chips">${[['pending', 'Pendents'], ['accepted', 'Justificades'], ['all', 'Totes']]
      .map(([v, n]) => `<button class="chip" aria-pressed="${ui.incFilter === v}" data-act="inc-filter" data-v="${v}">${n}</button>`).join('')}</div>
    <div class="panel">${list.length ? list.map(i => incCard(i, true)).join('')
      : '<div class="empty" style="padding:28px"><p>Cap avís en aquest estat.</p></div>'}</div>
    <div class="privacy">Quan acceptes un avís, la falta queda marcada com a justificada (o com a retard) a la llista de la sessió corresponent.</div>`;
}

/* ================= Sheets ================= */
let sheetSave = null;
let scrollLockY = 0;
function lockScroll() {
  scrollLockY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${scrollLockY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockScroll() {
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, scrollLockY);
}
function sheet({ title, body, foot }) {
  $('#sheet-root').innerHTML = `<div class="sheet-back" data-act="sheet-back"><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2 class="h2">${title}</h2><button class="icon-btn plain" data-act="sheet-close">${ICON.close}</button></div>
    <div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</div></div>`;
  lockScroll();
}
const closeSheet = () => { $('#sheet-root').innerHTML = ''; sheetSave = null; unlockScroll(); };
function toast(msg) { $('#toast-root').innerHTML = `<div class="toast">${esc(msg)}</div>`; setTimeout(() => { $('#toast-root').innerHTML = ''; }, 2600); }

function userSheet(x) {
  const isNew = !x.id;
  const editCred = isNew ? can.createUsers() : can.credentials(x);
  const editRoles = can.createUsers();
  const editSection = level(me()) >= 3 || can.createUsers();
  const editActive = level(me()) >= 3;
  const insts = instrumentsFor(x.section);
  let staffOnly = rolesOf(x).every(r => r === 'admin' || r === 'director');
  sheet({
    title: isNew ? 'Nou usuari' : esc(x.name),
    body: `<div class="field"><span>Nom i cognoms</span><input class="inp" id="u-name" value="${esc(x.name || '')}" ${level(me()) >= 2 ? '' : 'disabled'}></div>
      ${editSection ? `<div class="field" id="u-sec-wrap" ${staffOnly ? 'hidden' : ''}><span>Secció</span><div class="pickers" id="u-sec">
        ${SECTIONS.map(s => `<button type="button" class="pick" data-sec="${s.id}" aria-pressed="${x.section === s.id}">${s.name}</button>`).join('')}</div></div>
      <div class="field" id="u-inst-wrap" ${staffOnly ? 'hidden' : ''}><span>Instrument(s)</span><div class="pickers" id="u-inst">
        ${insts.map(i => `<button type="button" class="pick" data-inst="${esc(i)}" aria-pressed="${(x.instrument || '').split(' / ').includes(i)}">${esc(i)}</button>`).join('')}</div>
        </div>
      <div class="field" id="u-staff-note" ${staffOnly ? '' : 'hidden'}><small class="muted">Aquest càrrec no pertany a cap secció.</small></div>` : ''}
      ${editRoles ? `<div class="field"><span>Rols</span><div class="pickers" id="u-roles">
        ${Object.entries(ROLES).map(([k, v]) => `<button type="button" class="pick" data-role="${k}" aria-pressed="${rolesOf(x).includes(k)}">${v.name}</button>`).join('')}</div>
        <small>Es poden combinar (per exemple, Junta i Cap de secció alhora).</small></div>`
        : `<div class="field"><span>Rols</span><div>${roleBadges(x)}</div></div>`}
      ${editCred ? `<fieldset style="border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:12px">
        <legend style="padding:0 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)">Credencials</legend>
        <div class="field"><span>Usuari</span><input class="inp" id="u-user" value="${esc(x.username || '')}" placeholder="nom.cognom" autocapitalize="none"></div>
        <div class="field"><span>Contrasenya</span><div id="u-pass-wrap">${isNew
          ? passField('u-pass', undefined, '1234')
          : `<div style="display:flex;gap:8px;align-items:center"><input class="inp" value="••••••••" disabled style="flex:1;letter-spacing:3px;color:var(--muted)"><button type="button" class="btn btn-sm" data-act="unlock-pass">Edita</button></div>`}</div>
          ${isNew ? '' : '<small class="muted">Es manté igual tret que la canviïs expressament.</small>'}</div></fieldset>`
        : ''}
      ${editActive ? `<div class="toggle-row"><span><b>Actiu</b><br><span class="muted" style="font-size:12.5px">Els inactius no surten a les llistes ni poden entrar</span></span>
        <label class="switch"><input type="checkbox" id="u-active" ${x.active !== false ? 'checked' : ''}><span></span></label></div>` : ''}`,
    foot: `${!isNew && can.createUsers() && x.id !== ME ? `<button class="btn btn-sm btn-danger-ghost" data-act="del-user" data-uid="${x.id}">Elimina</button>` : ''}
      <span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button>
      <button class="btn btn-primary" data-act="sheet-save">${isNew ? 'Crea' : 'Desa'}</button>`,
  });
  const draft = { ...x, roles: rolesOf(x).slice(), section: staffOnly ? '' : (x.section || ''),
    instruments: staffOnly ? [] : (x.instrument ? x.instrument.split(' / ') : []) };
  const secBox = $('#u-sec');
  if (secBox) secBox.addEventListener('click', e => {
    const b = e.target.closest('[data-sec]'); if (!b) return;
    draft.section = b.dataset.sec;
    $$('#u-sec .pick').forEach(p => p.setAttribute('aria-pressed', p.dataset.sec === draft.section));
    const list = instrumentsFor(draft.section);
    $('#u-inst').innerHTML = list.map(i => `<button type="button" class="pick" data-inst="${esc(i)}" aria-pressed="false">${esc(i)}</button>`).join('');
    draft.instruments = [];
  });
  $('#u-inst').addEventListener('click', e => {
    const b = e.target.closest('[data-inst]'); if (!b) return;
    const inst = b.dataset.inst;
    if (draft.instruments.includes(inst)) draft.instruments = draft.instruments.filter(v => v !== inst); else draft.instruments.push(inst);
    $$('#u-inst .pick').forEach(p => p.setAttribute('aria-pressed', draft.instruments.includes(p.dataset.inst)));
  });
  const rolesBox = $('#u-roles');
  if (rolesBox) rolesBox.addEventListener('click', e => {
    const b = e.target.closest('[data-role]'); if (!b) return;
    const r = b.dataset.role;
    if (draft.roles.includes(r)) draft.roles = draft.roles.filter(v => v !== r); else draft.roles.push(r);
    if (!draft.roles.length) draft.roles = ['musician'];
    $$('#u-roles .pick').forEach(p => p.setAttribute('aria-pressed', draft.roles.includes(p.dataset.role)));
    const wasStaffOnly = staffOnly;
    staffOnly = draft.roles.every(v => v === 'admin' || v === 'director');
    if ($('#u-sec-wrap')) $('#u-sec-wrap').hidden = staffOnly;
    if ($('#u-inst-wrap')) $('#u-inst-wrap').hidden = staffOnly;
    if ($('#u-staff-note')) $('#u-staff-note').hidden = !staffOnly;
    if (staffOnly && !wasStaffOnly) { draft.section = ''; draft.instruments = []; }
  });
  sheetSave = async () => {
    const name = $('#u-name').value.trim();
    if (!name) { toast('Falta el nom'); return false; }
    if (secBox && !staffOnly && !draft.section) { toast('Tria una secció'); return false; }
    const isNewUser = !x.id;
    const rec = {
      id: x.id, name,
      section: secBox ? draft.section : (x.section || ''),
      instrument: draft.instruments.join(' / '),
      roles: draft.roles, active: editActive ? $('#u-active').checked : x.active !== false,
      username: x.username,
    };
    if (isNewUser) {
      const un = $('#u-user').value.trim().toLowerCase();
      const pw = $('#u-pass').value.trim();
      if (!un || !pw) { toast('Usuari i contrasenya no poden ser buits'); return false; }
      if (S.users.some(o => o.username === un)) { toast('Aquest usuari ja existeix'); return false; }
      let newId = null;
      try {
        const r = await sb.rpc('create_user', { p_username: un, p_password: pw, p_name: name, p_section: rec.section, p_instrument: rec.instrument, p_roles: rec.roles });
        if (!r.error) newId = r.data;
      } catch (e) { console.warn(e); }
      if (!newId) { toast('No s\'ha pogut crear l\'usuari'); return false; }
      rec.id = newId; rec.username = un;
    } else if (editCred) {
      const un = $('#u-user').value.trim().toLowerCase();
      const passInp = document.getElementById('u-pass');
      const pw = passInp ? passInp.value.trim() : '';
      if (!un) { toast('L\'usuari no pot ser buit'); return false; }
      if (S.users.some(o => o.id !== rec.id && o.username === un)) { toast('Aquest usuari ja existeix'); return false; }
      let ok = false;
      try { const r = await sb.rpc('admin_set_credentials', { p_user_id: rec.id, p_username: un, p_new_password: pw || null }); ok = !r.error && r.data === true; }
      catch (e) { console.warn(e); }
      if (!ok) { toast('No s\'han pogut actualitzar les credencials'); return false; }
      rec.username = un;
    }
    if (rec.roles.includes('leader') && rec.section) S.users.forEach(o => { if (o.id !== rec.id && o.section === rec.section && hasRole(o, 'leader')) o.roles = rolesOf(o).filter(r => r !== 'leader'); });
    const i = S.users.findIndex(o => o.id === rec.id);
    if (i >= 0) S.users[i] = { ...S.users[i], ...rec }; else S.users.push({ ...rec, mustChangePassword: true });
    save(); return true;
  };
}

function repeatSheet(pid) {
  const p = S.projects.find(x => x.id === pid);
  sheet({
    title: 'Genera assajos setmanals',
    body: `<div class="field"><span>Dia</span><select class="inp" id="r-wd">
        ${[['1', 'Dilluns'], ['2', 'Dimarts'], ['3', 'Dimecres'], ['4', 'Dijous'], ['5', 'Divendres'], ['6', 'Dissabte'], ['0', 'Diumenge']]

      <div class="row2"><div class="field"><span>Des de</span><input class="inp" type="date" id="r-from" value="${esc((p && p.from) || TODAY)}"></div>
        <div class="field"><span>Fins a</span><input class="inp" type="date" id="r-to" value="${esc((p && p.to) || '')}"></div></div>
      <div class="row2"><div class="field"><span>Inici</span><input class="inp" type="time" id="r-time" value="21:30"></div>
        <div class="field"><span>Fi</span><input class="inp" type="time" id="r-end" value="00:00"></div></div>
      <div class="field"><span>Lloc</span><select class="inp" id="r-place">
        <option value="">Sense especificar</option>
        ${(S.config.places || []).map(pl => `<option value="${esc(pl)}" ${pl === 'Aula 0P2' ? 'selected' : ''}>${esc(pl)}</option>`).join('')}</select></div>`,
    foot: `<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" data-act="sheet-save">Genera</button>`,
  });
  sheetSave = () => {
    const p = S.projects.find(x => x.id === pid);
    const from = $('#r-from').value, to = $('#r-to').value, wd = Number($('#r-wd').value);
    if (!p || !from || !to || to < from) { toast('Revisa les dates'); return false; }
    const time = $('#r-time').value, end = $('#r-end').value, place = $('#r-place').value;
    let d = parseISO(from), n = 0, guard = 0;
    while (d.getDay() !== wd && guard++ < 8) d.setDate(d.getDate() + 1);
    while (isoDate(d) <= to && n < 120) {
      const date = isoDate(d);
      const ex = S.sessions.find(s => s.date === date && s.time === time);
      if (ex) { if (!ex.projIds.includes(p.id)) { ex.projIds.push(p.id); n++; } }
      else { S.sessions.push({ id: newId(), projIds: [p.id], date, time, end, type: 'Assaig', place, note: '' }); n++; }
      d.setDate(d.getDate() + 7);
    }
    save(); toast(n ? `${n} assajos afegits` : 'Cap sessió nova'); return true;
  };
}

      <div class="field"><span>Motiu</span><textarea class="inp" id="i-reason" placeholder="Explica-ho breument"></textarea></div>
      <div class="privacy">L'avís s'enviarà al cap de secció i a la Junta.</div>`,
    foot: `<span class="spacer"></span><button class="btn" data-act="sheet-close">Cancel·la</button><button class="btn btn-primary" data-act="sheet-save">Envia</button>`,
  });
