  $('#i-sess').addEventListener('click', e => {
    const b = e.target.closest('[data-sid]'); if (!b) return;
    const sid = b.dataset.sid;
    if (chosen.has(sid)) chosen.delete(sid); else chosen.add(sid);
    const s = next.find(x => x.id === sid);
    b.outerHTML = sessRow(s);
  });
  $('#i-kind').addEventListener('click', e => {
    const b = e.target.closest('[data-kind]'); if (!b) return;
    kind = b.dataset.kind;
    $$('#i-kind .pick').forEach(p => p.setAttribute('aria-pressed', p.dataset.kind === kind));
    $('#i-minwrap').hidden = kind !== 'late';
  });
  $('#i-min').addEventListener('click', e => {
    const b = e.target.closest('[data-min]'); if (!b) return;
    min = Number(b.dataset.min);
    $$('#i-min .pick[data-min]').forEach(p => p.setAttribute('aria-pressed', Number(p.dataset.min) === min));
    $('#i-min-custom').value = ''; $('#i-min-custom').setAttribute('aria-pressed', 'false');
  });
  $('#i-min-custom').addEventListener('change', e => {
    const n = Number(e.target.value);
    if (!n || n < 1) return;
    min = Math.min(180, n);
    $$('#i-min .pick[data-min]').forEach(p => p.setAttribute('aria-pressed', false));
    e.target.setAttribute('aria-pressed', 'true');
  });
  sheetSave = () => {
    if (!chosen.size) { toast('Tria almenys una sessió'); return false; }
    const reason = $('#i-reason').value.trim();
    if (!reason) { toast('Escriu el motiu'); return false; }
    for (const sid of chosen) {
      S.incidents = S.incidents.filter(i => !(i.userId === ME && i.sessionId === sid && i.status === 'pending'));
      S.incidents.push({ id: newId(), userId: ME, sessionId: sid, kind, min: kind === 'late' ? min : null,
        reason, status: 'pending', createdAt: stamp(), reviewedBy: null, reviewedAt: null, reviewNote: '' });
    }
    save(); toast(chosen.size > 1 ? `Avís enviat per a ${chosen.size} sessions` : 'Avís enviat'); return true;
  };
}
function reviewIncident(id, accept) {
  const inc = S.incidents.find(i => i.id === id); if (!inc || !can.reviewIncident(inc)) return;
  inc.status = accept ? 'accepted' : 'rejected';
  inc.reviewedBy = ME; inc.reviewedAt = stamp(); inc.reviewNote = '';
  // Una falta no justificada no arrossega cap motiu.

  setMark(inc.sessionId, inc.userId, val);
  save(); closeSheet(); render();
  toast(accept ? 'Avís justificat' : 'Marcada com a no justificada');
}

function summarySheet(sec) {
  const cur = currentSession(); if (!cur) return;
  const secs = sec ? [sec] : SECTIONS.map(x => x.id).filter(id => convoked(cur, id) && (can.section(id) || level(me()) >= 3));
  let txt = `${S.config.name} · ${capz(longDate(cur.date))}\n${cur.type || 'Assaig'}${timeRange(cur) ? ' ' + timeRange(cur) : ''}${cur.place ? ' · ' + cur.place : ''}\n`;
  const tot = emptyCounts();
  for (const id of secs) {
    const ms = membersOf(id).filter(u => inSession(cur, u)); if (!ms.length) continue;
    const c = countsFor(cur, id); for (const k of Object.keys(tot)) tot[k] += c[k];
    txt += `\n${SEC[id].name.toUpperCase()} (${c.P + c.R}/${c.total})\n`;
    for (const k of ORDER) {
      if (k === 'P') continue;
      const names = ms.filter(m => mark(cur.id, m.id)?.s === k);
      if (names.length) txt += `  ${STATUS[k].short}: ${names.map(m => { const mk = mark(cur.id, m.id); return m.name + (mk.note ? ` (${mk.note})` : ''); }).join(', ')}\n`;
    }
    const pend = ms.filter(m => !mark(cur.id, m.id));
    if (pend.length) txt += `  Per marcar: ${pend.map(m => m.name).join(', ')}\n`;
  }
  txt += `\nTotal: ${tot.P + tot.R} de ${tot.total}${rate(tot) != null ? ` (${pct(rate(tot))})` : ''}`;
  sheet({ title: 'Resum de la llista', body: `<textarea class="summary-pre" id="sum-txt" readonly>${esc(txt)}</textarea>`,
    foot: `<span class="spacer"></span><button class="btn btn-primary" data-act="copy-sum">Copia</button>` });
}

async function doExport(copyOnly) {
  const data = JSON.stringify(S, null, 2);
  const filename = `banda-terrassa-${TODAY}.json`;
  if (!copyOnly) {
    try { const dl = window.claude && await window.claude.use('downloads'); if (dl) { await dl.save({ filename, data }); toast('Fitxer desat'); return; } } catch {}
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Fitxer descarregat'); return;
    } catch {}
  }
  try { await navigator.clipboard.writeText(data); toast('Dades copiades'); }
  catch { sheet({ title: 'Còpia manual', body: `<textarea class="summary-pre">${esc(data)}</textarea>`, foot: `<span class="spacer"></span><button class="btn btn-primary" data-act="sheet-close">Tanca</button>` }); }

  for (let i = 0; i < 10; i++) {
    // Alguns assajos serveixen per als dos projectes alhora.
    S.sessions.push({ id: uid('s'), projIds: i >= 4 && i <= 6 ? [p.id, p2.id] : [p.id], date: isoDate(d), time: '20:00', end: '22:00',
      type: i === 9 ? 'Concert' : i === 8 ? 'Assaig general' : 'Assaig',
      place: i >= 8 ? S.config.places[1] : S.config.places[0], note: '' });
    d.setDate(d.getDate() + 7);
  }
  for (const s of S.sessions) {
    if (s.date > TODAY) continue;
    for (const u of S.users.filter(x => inCensus(x) && inSession(s, x))) {
      const r = Math.random();
      const st = r < .76 ? 'P' : r < .85 ? 'R' : r < .94 ? 'FJ' : 'FNJ';
      S.attendance[aKey(s.id, u.id)] = st === 'R' ? { s: st, min: 10 } : st === 'FJ' ? { s: st, note: 'Feina' } : { s: st };
    }
  }
  const next = S.sessions.find(s => s.date >= TODAY);
  const anna = S.users.find(u => u.name === 'Anna Puig');
  if (next && anna) S.incidents.push({ id: uid('i'), userId: anna.id, sessionId: next.id, kind: 'absence', min: null,
    reason: 'Viatge de feina, torno divendres a la nit.', status: 'pending', createdAt: stamp(), reviewedBy: null, reviewedAt: null, reviewNote: '' });
  save(); toast('Dades d\'exemple carregades. Prova admin/1234 o anna.puig/1234');
  render();
}

/* ================= Events ================= */
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginf') return;
  e.preventDefault();
  const un = $('#lg-user').value.trim().toLowerCase();
  const pw = $('#lg-pass').value;
  const btn = e.target.querySelector('button[type=submit]');
  if (btn) btn.disabled = true;
  let row = null;
  try {
    const { data, error } = await sb.rpc('login', { p_username: un, p_password: pw });
    if (!error && data && data.length) row = data[0];
  } catch (e) { console.warn(e); }
  if (btn) btn.disabled = false;
  if (!row) { $('#shell').innerHTML = viewLogin('Usuari o contrasenya incorrectes'); return; }
  if (row.active === false) { $('#shell').innerHTML = viewLogin('Aquest usuari està desactivat'); return; }
  const u = { id: row.id, username: row.username, name: row.name, section: row.section || '', instrument: row.instrument || '',
    roles: row.roles && row.roles.length ? row.roles : ['musician'], active: row.active !== false, mustChangePassword: !!row.must_change_password };
  const i = S.users.findIndex(x => x.id === u.id);
  if (i >= 0) S.users[i] = u; else S.users.push(u);
  ME = u.id;
  if ($('#lg-keep').checked) saveSession(); else { try { localStorage.removeItem(LS_SESSION); } catch {} }
  ui.tab = null;
  splash(() => { render(); if (u.mustChangePassword) changePasswordSheet(true); });
});

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  const cur = currentSession();
  switch (a) {
    case 'tab': ui.tab = el.dataset.tab; ui.rollSec = null; if (ui.tab === 'llista') ui.sessionId = null; save(); render(); window.scrollTo(0, 0); return;
    case 'logout': ME = null; REAL_ADMIN = null; saveSession(); ui.tab = null; render(); return;
    case 'demo': return demo();

    /* llista */
    case 'sess-prev': case 'sess-next': {
      const list = allSessions(); const i = list.findIndex(s => s.id === (cur && cur.id));
      const j = a === 'sess-prev' ? i - 1 : i + 1;
      if (list[j]) { ui.sessionId = list[j].id; ui.rollSec = null; render(); } return;
    }
    case 'sess-pick': return sessionPicker();
    case 'pick-sess': ui.sessionId = el.dataset.sid; ui.rollSec = null; closeSheet(); render(); return;
    case 'goto-sess': closeSheet(); ui.sessionId = el.dataset.sid; ui.rollSec = null; ui.tab = 'llista'; ui.llistaMode = 'roll'; save(); render(); window.scrollTo(0, 0); return;
    case 'sess-info': return sessionInfo(el.dataset.sid);
    case 'open-sec': ui.rollSec = el.dataset.sec; render(); window.scrollTo(0, 0); return;
    case 'close-sec': ui.rollSec = null; render(); window.scrollTo(0, 0); return;
    case 'mark': {
      if (!cur || !can.passList()) return;
      const mid = el.dataset.mid, s = el.dataset.s;
      const target = userById(mid);
      if (!can.section(target.section)) { toast('Només pots passar llista de la teva secció'); return; }
      const prev = mark(cur.id, mid);
      if (prev && prev.s === s) setMark(cur.id, mid, null);
      else setMark(cur.id, mid, { s, ...(s === 'R' ? { min: prev?.min || 10 } : {}), ...(prev?.note && s !== 'P' ? { note: prev.note } : {}) });
      render(); return;
    }
    case 'min': { if (!cur) return; const mk = mark(cur.id, el.dataset.mid); if (!mk) return;
      setMark(cur.id, el.dataset.mid, { ...mk, min: Number(el.dataset.min) }); render(); return; }
    case 'rest-present': {
      if (!cur || !can.section(el.dataset.sec)) return;
      for (const m of membersOf(el.dataset.sec)) if (inSession(cur, m) && !mark(cur.id, m.id)) setMark(cur.id, m.id, { s: 'P' });
      render(); toast('Llista completada'); return;
    }
    case 'summary': return summarySheet(el.dataset.sec || null);
    case 'copy-sum': { const t = $('#sum-txt');
      navigator.clipboard.writeText(t.value).then(() => toast('Resum copiat')).catch(() => { t.removeAttribute('readonly'); t.select(); }); return; }

    /* calendari + estadístiques */
    case 'cal-proj': ui.calProj = el.dataset.id; save(); render(); return;
    case 'cal-past': ui.calPast = !ui.calPast; render(); return;
    case 'cal-mode': ui.calMode = el.dataset.id; save(); render(); window.scrollTo(0, 0); return;
    case 'stats-proj': ui.statsProj = el.dataset.id; save(); render(); return;
    case 'pick-proj': return projectPickerSheet(el.dataset.scope);
    case 'cal-subscribe': return subscribeSheet();
    case 'proj-pick-go': {
      if (el.dataset.scope === 'cal') ui.calProj = el.dataset.id; else ui.statsProj = el.dataset.id;
      save(); closeSheet(); render(); return;
    }
    case 'stats-sec': ui.statsSec = el.dataset.sec; render(); return;
    case 'member-detail': return memberDetail(el.dataset.mid);

    /* incidències */
    case 'new-incident': return incidentSheet();
    case 'inc-filter': ui.incFilter = el.dataset.v; save(); render(); return;
    case 'inc-accept': return reviewIncident(el.dataset.id, true);
    case 'inc-reject': return reviewIncident(el.dataset.id, false);
    case 'inc-open': return incidentDetail(el.dataset.id);
    case 'inc-reopen': { const i = S.incidents.find(x => x.id === el.dataset.id);
      if (i && can.reviewIncident(i)) { i.status = 'pending'; i.reviewedBy = null; i.reviewedAt = null; save(); closeSheet(); render(); } return; }

    /* gestió */
    case 'manage': ui.manage = el.dataset.id; ui.search = ''; save(); render(); return;
    case 'llista-mode': ui.llistaMode = el.dataset.id; ui.rollSec = null; save(); render(); window.scrollTo(0, 0); return;
    case 'new-user': return userSheet({ section: el.dataset.sec || '', roles: ['musician'], active: true });
    case 'edit-user': { const x = userById(el.dataset.uid); if (x && can.seeMember(x)) userSheet({ ...x }); return; }
    case 'del-user': {
      if (!confirm('Eliminar aquest usuari i totes les seves dades d\'assistència?')) return;
      const id = el.dataset.uid;
      S.users = S.users.filter(u => u.id !== id);
      S.incidents = S.incidents.filter(i => i.userId !== id);
      for (const k of Object.keys(S.attendance)) if (k.endsWith('|' + id)) delete S.attendance[k];
      save(); closeSheet(); render(); toast('Usuari eliminat'); return;
    }
    case 'new-proj': return projSheet({});
    case 'edit-proj': { const p = S.projects.find(x => x.id === el.dataset.pid); if (p) projSheet({ ...p }); return; }
    case 'view-proj': return repertoireSheet(el.dataset.pid);
    case 'del-proj': {
      if (!confirm('Eliminar el projecte? Les sessions que només pertanyien a aquest projecte també s\'eliminaran.')) return;
      const pid = el.dataset.pid;
      const orphans = [];
      for (const s of S.sessions) { s.projIds = (s.projIds || []).filter(x => x !== pid); if (!s.projIds.length) orphans.push(s.id); }
      for (const sid of orphans) {
        for (const k of Object.keys(S.attendance)) if (k.startsWith(sid + '|')) delete S.attendance[k];
        S.incidents = S.incidents.filter(i => i.sessionId !== sid);
      }
      S.sessions = S.sessions.filter(s => !orphans.includes(s.id));
      S.projects = S.projects.filter(x => x.id !== pid);
      save(); closeSheet(); render(); return;
    }
    case 'new-session': { if (!S.projects.length) { toast('Crea primer un projecte'); return projSheet({}); } return sessionSheet({}, el.dataset.pid); }
    case 'sess-edit': { const s = sessionById(el.dataset.sid); if (s && can.manageProjects()) sessionSheet({ ...s }); return; }
    case 'edit-sess-project': { if (hasRole(me(), 'director')) sessionProjectSheet(el.dataset.sid); return; }
    case 'del-session': {
      if (!confirm('Eliminar la sessió i la seva llista?')) return;
      const sid = el.dataset.sid;
      S.sessions = S.sessions.filter(x => x.id !== sid);
      for (const k of Object.keys(S.attendance)) if (k.startsWith(sid + '|')) delete S.attendance[k];
      S.incidents = S.incidents.filter(i => i.sessionId !== sid);
      if (ui.sessionId === sid) ui.sessionId = null;
      save(); closeSheet(); render(); return;
    }
    case 'list-sessions': return listSessionsSheet(el.dataset.pid);
    case 'repeat-sessions': return repeatSheet(el.dataset.pid);
    case 'edit-identity': return identitySheet();
    case 'edit-rules': return rulesSheet();
    case 'edit-places': return placesSheet();
    case 'edit-types': return typesSheet();
    case 'edit-instruments': return sectionsSheet();
    case 'new-section': return sectionEditSheet(null);
    case 'edit-section': return sectionEditSheet(el.dataset.id);
    case 'sec-move': {
      const i = Number(el.dataset.i), dir = Number(el.dataset.dir), j = i + dir;
      if (j < 0 || j >= SECTIONS.length) return;
      [SECTIONS[i], SECTIONS[j]] = [SECTIONS[j], SECTIONS[i]];
      saveSections(); sectionsSheet(); return;
    }
    case 'del-section': {
      const id = el.dataset.id;
      const n = membersOf(id).length;
      if (n) { toast(`No es pot eliminar: ${n} músic${n === 1 ? '' : 's'} hi són assignats`); return; }
      if (!confirm(`Eliminar la secció "${SEC[id].name}"?`)) return;
      SECTIONS = SECTIONS.filter(x => x.id !== id);
      SEC = Object.fromEntries(SECTIONS.map(x => [x.id, x]));
      saveSections(); closeSheet(); sectionsSheet(); return;
    }
    case 'export': return doExport(false);
    case 'export-copy': return doExport(true);
    case 'import': return importSheet();
    case 'impersonate': return impersonateSheet();
    case 'show-help': return helpSheet();
    case 'impersonate-go': {
      const targetId = el.dataset.uid;
      if (REAL_ADMIN && targetId === REAL_ADMIN) { ME = REAL_ADMIN; REAL_ADMIN = null; }
      else { if (!REAL_ADMIN) REAL_ADMIN = ME; ME = targetId; }
      saveSession(); closeSheet(); ui.tab = null; ui.rollSec = null; render(); window.scrollTo(0, 0); return;
    }
    case 'end-impersonate': {
      if (!REAL_ADMIN) return;
      ME = REAL_ADMIN; REAL_ADMIN = null; saveSession(); ui.tab = null; ui.rollSec = null; render(); window.scrollTo(0, 0); return;
    }
    case 'wipe': {
      if (!confirm('Esborrar tots els usuaris, projectes, llistes i avisos?')) return;
      S = structuredClone(DEFAULT); await seedAdmin(); ME = null; saveSession(); save(); render(); return;
    }

    /* sheet */
    case 'change-password': return changePasswordSheet(false);
    case 'unlock-pass': {
      const wrap = document.getElementById('u-pass-wrap'); if (!wrap) return;
      wrap.innerHTML = passField('u-pass', 'Estableix-ne una de nova', '');
      return;
    }
    case 'toggle-pass': {
      const inp = document.getElementById(el.dataset.target); if (!inp) return;
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      el.setAttribute('aria-pressed', String(show));
      return;
    }
    case 'sheet-back': if (e.target === el) closeSheet(); return;
    case 'sheet-close': return closeSheet();
    case 'sheet-save': { const ok = sheetSave && await sheetSave(); if (ok !== false) { closeSheet(); render(); } return; }
  }
});

document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.act === 'toggle-late') { S.config.countLateAsPresent = e.target.checked; save(); render(); }
  if (e.target.dataset && e.target.dataset.act === 'min-custom') {
    const cur = currentSession(); if (!cur) return;
    const mid = e.target.dataset.mid; const mk = mark(cur.id, mid); if (!mk) return;
    const n = Number(e.target.value);
    if (!n || n < 1) return;
    setMark(cur.id, mid, { ...mk, min: Math.min(180, n) });
    render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'usearch') { ui.search = el.value; const v = el.value; render(); const s = $('#usearch'); if (s) { s.value = v; s.focus(); s.setSelectionRange(v.length, v.length); } return; }
  if (el.dataset && el.dataset.act === 'note') {
    const cur = currentSession(); if (!cur) return;
    const mk = mark(cur.id, el.dataset.mid); if (!mk) return;
    S.attendance[aKey(cur.id, el.dataset.mid)] = { ...mk, note: el.value, by: ME, at: stamp() };
    save();
  }
});

/* ================= Init ================= */
(async () => {
  await load();
  if (ME) splash(() => { render(); const u = me(); if (u && u.mustChangePassword) changePasswordSheet(true); }); else render();
})();
})();
</script>
