# Evita que Supabase aturi el projecte per inactivitat (pla gratuït: 1 setmana sense activitat).
# Cada 2 dies fa una consulta lleugera de només lectura. No canvia cap dada.
name: Mantenir Supabase actiu
on:
  schedule:
    - cron: "41 6 */2 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta lleugera a Supabase
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 --max-time 40 \
            -X POST "https://crveneipgpopqefszgkw.supabase.co/rest/v1/rpc/app_public" \
            -H "apikey: sb_publishable_KW-GLDoI1yaVjBEwQPhDvQ_AvcIPpkc" -H "Content-Type: application/json" -d '{}')
          echo "Resposta de Supabase: $code"
          # qualsevol resposta del servidor (200/4xx) val; un 5xx o cap resposta vol dir que el projecte està aturat
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then echo "::error::Supabase no respon ($code). Potser s'ha aturat: restaura'l des del tauler."; exit 1; fi
      - name: Evitar que GitHub desactivi aquesta tasca (60 dies sense activitat)
        run: |
          # només si l'últim canvi del repositori té més de 45 dies; fa un commit buit, sense tocar cap fitxer
          ultim=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultim )) -gt $(( 45*86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manteniment automàtic: evita que s'aturi la tasca programada"
            git push
          else
            echo "El repositori té activitat recent: no cal fer res."
          fi
